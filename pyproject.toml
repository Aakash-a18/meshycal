[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshycal"
version = "0.0.1"
description = "The first Delegation built on Mesherra: scheduling, agent-mediated, privacy-preserving."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MeshyCal contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mesherra",                 # sibling trust layer; sourced via [tool.uv.sources] below
    "jsonschema>=4.21",         # validate proposal payloads against meshycal.scheduling/proposal-v1
    "pydantic>=2.0",            # MeshyCal-side typed models
    "pydantic-settings>=2.0",   # env-var configuration (matches Mesherra's discipline)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[tool.uv.sources]
mesherra = { path = "../mesherra", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["demos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["demos/phase_1/tests", "demos/phase_4_prototype/tests"]
