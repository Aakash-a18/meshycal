      recipient.value = SB_STATE.principals.some(p => p.id === recipientVal && p.id !== sender.value) ? recipientVal : (altDefault ? altDefault.id : "");
    }
    updateFireState();
  }

  function pad2(n) { return String(n).padStart(2, "0"); }

  function defaultDateTimes() {
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const yyyy = tomorrow.getFullYear();
    const mm = pad2(tomorrow.getMonth() + 1);
    const dd = pad2(tomorrow.getDate());
    return {
      earliest: yyyy + "-" + mm + "-" + dd + "T09:00",
      latest:   yyyy + "-" + mm + "-" + dd + "T18:00"
    };
  }

  function hydrateRequestForm() {
    const d = defaultDateTimes();
    $("sb-req-earliest").value = d.earliest;
    $("sb-req-latest").value   = d.latest;
  }

  function updateFireState() {
    const fire = $("sb-fire-btn");
    const hint = $("sb-fire-hint");
    if (SB_STATE.runInProgress) {
      fire.disabled = true; hint.textContent = "run in progress…"; return;
    }
    if (SB_STATE.principals.length < 2) {
      fire.disabled = true; hint.textContent = "add at least 2 principals"; return;
    }
    const s = $("sb-req-sender").value;
    const r = $("sb-req-recipient").value;
    if (!s || !r) { fire.disabled = true; hint.textContent = "pick a sender and recipient"; return; }
    if (s === r)  { fire.disabled = true; hint.textContent = "sender and recipient must differ"; return; }
    fire.disabled = false;
    hint.textContent = SB_STATE.principals.length >= 3 ? "supports 2-party · 3-party cascade" : "2-party run";
  }

  /* ===================================================================
   *  Stage rendering
   * =================================================================== */
  function setStageIdle() {
    const root = $("sb-stage-root");
    clearChildren(root);
    const idle = elem("div", { className: "sb-stage-idle", attrs: { id: "sb-stage-idle" } });
    idle.appendChild(document.createTextNode("fire a request to begin"));
    idle.appendChild(elem("span", { className: "small", text: "the run will appear here" }));
    root.appendChild(idle);
    $("sb-step-indicator").classList.add("sb-hidden");
    $("sb-status-bar").classList.add("sb-hidden");
    $("sb-abort-banner").classList.remove("sb-abort-visible");
  }

  function buildNarrativeBand() {
    const band = elem("div", { className: "sb-narrative-band" });
    band.appendChild(elem("div", { className: "sb-nb-eyebrow", text: "the run · narrated" }));
    band.appendChild(elem("p", { className: "sb-nb-text", attrs: { id: "sb-nb-text" }, text: "preparing the lab…" }));
    return band;
  }

  function buildStageGrid(principalIds) {
    const isThree = principalIds.length === 3;
    const stage = elem("div", { className: "sb-stage" + (isThree ? " sb-stage--3" : "") });

    principalIds.forEach((pid, idx) => {
      const p = principalById(pid);
      if (!p) return;
      const isPivot = isThree && idx === 1;
      const col = elem("div", { className: "sb-party" });
      col.dataset.pid = pid;

      // Who
      const who = elem("div", { className: "who" });
      who.appendChild(elem("div", {
        className: "sb-stage-avatar sb-stage-avatar--slot-" + p.colorSlot,
        text: initialsOf(p.displayName)
      }));
      const whoTxt = elem("div");
      whoTxt.appendChild(elem("div", { className: "who-name", text: p.displayName }));
      whoTxt.appendChild(elem("div", { className: "who-id", text: p.id }));
      who.appendChild(whoTxt);
      col.appendChild(who);

      // Calendar
      col.appendChild(elem("div", { className: "sb-panel-label", text: "calendar" }));
      const cal = elem("div", { className: "sb-calendar", attrs: { id: "sb-cal-" + slugify(pid) } });
      if (p.calendar.length === 0) {
        cal.appendChild(elem("div", { className: "sb-cal-empty", text: "— no events —" }));
      } else {
        p.calendar.forEach(ev => cal.appendChild(buildCalendarEvent(ev, pid)));
      }
      col.appendChild(cal);

      // Payload panel (scoped disclosure visualization) — built lazily during run
      const ppHost = elem("div", { className: "sb-panel-label sb-hidden", text: "scoped payload" });
      ppHost.dataset.role = "pp-label";
      col.appendChild(ppHost);
      const pp = elem("div", { className: "sb-payload-panel sb-hidden", attrs: { id: "sb-pp-" + slugify(pid) } });
      col.appendChild(pp);

      // Reasoning trace (pivot only)
      if (isPivot) {
        const trace = elem("div", { className: "sb-reasoning-trace", attrs: { id: "sb-trace-" + slugify(pid) } });
        const header = elem("div", { className: "sb-trace-header" });
        header.appendChild(elem("span", { className: "sb-trace-eyebrow", text: "agent reasoning" }));
        header.appendChild(elem("span", { className: "sb-trace-spinner sb-trace-spinner--active", attrs: { "aria-hidden": "true" } }));
        trace.appendChild(header);
        trace.appendChild(elem("div", { className: "sb-trace-fields", attrs: { id: "sb-trace-fields-" + slugify(pid) } }));
        trace.appendChild(elem("div", { className: "sb-trace-reason-label", text: "reasoner verdict" }));
        trace.appendChild(elem("pre", { className: "sb-trace-reason", attrs: { id: "sb-trace-reason-" + slugify(pid) }, text: "…" }));
        col.appendChild(trace);
      }

      stage.appendChild(col);
    });

    // Arrows
    const arrows = buildArrowsLayer(principalIds);
    if (arrows) stage.appendChild(arrows);

    // Tessera-fit overlay
    stage.appendChild(buildFitOverlay());

    return stage;
  }

  function buildCalendarEvent(ev, pid) {
    const isBlocking = !!ev.isBlocking;
    const cls = "sb-cal-event" + (isBlocking ? " blocking" : "");
    const node = elem("div", { className: cls, attrs: { "data-slot": slotKey(pid, ev.time) } });
    node.appendChild(elem("span", { className: "time", text: ev.time }));
    const inner = elem("div");
    inner.appendChild(elem("div", { className: "title", text: ev.title || "(untitled)" }));
    if (ev.attendees) inner.appendChild(elem("div", { className: "attendees", text: ev.attendees }));
    node.appendChild(inner);
    return node;
  }

  function slotKey(pid, time) {
    return slugify(pid) + "-" + String(time || "").replace(":", "");
  }

  function buildArrowsLayer(principalIds) {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("class", "sb-arrows-layer");
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("viewBox", "0 0 1000 600");

    const defs = document.createElementNS(ns, "defs");
    const marker = document.createElementNS(ns, "marker");
    marker.setAttribute("id", "sb-arrowhead");
    marker.setAttribute("viewBox", "0 0 10 10");
    marker.setAttribute("refX", "8"); marker.setAttribute("refY", "5");
    marker.setAttribute("markerWidth", "6"); marker.setAttribute("markerHeight", "6");
    marker.setAttribute("orient", "auto");
    const tri = document.createElementNS(ns, "path");
    tri.setAttribute("d", "M0,0 L10,5 L0,10 Z");
    tri.setAttribute("fill", "var(--gold)");
    marker.appendChild(tri);
    defs.appendChild(marker);
    svg.appendChild(defs);

    if (principalIds.length === 2) {
      mkArrow(svg, ns, "sb-arrow-fwd",   "M 240 250 Q 500 200, 760 250");
      mkArrow(svg, ns, "sb-arrow-back",  "M 760 380 Q 500 430, 240 380");
    } else if (principalIds.length === 3) {
      mkArrow(svg, ns, "sb-arrow-ab", "M 180 230 Q 380 180, 540 230");
      mkArrow(svg, ns, "sb-arrow-bc", "M 540 230 Q 720 230, 880 260");
      mkArrow(svg, ns, "sb-arrow-cb", "M 880 360 Q 720 370, 540 380");
      mkArrow(svg, ns, "sb-arrow-ba", "M 540 380 Q 380 420, 180 380");
    }

    return svg;
  }

  function mkArrow(svg, ns, id, d) {
    const p = document.createElementNS(ns, "path");
    p.setAttribute("id", id);
    p.setAttribute("class", "sb-arrow");
    p.setAttribute("d", d);
    p.setAttribute("marker-end", "url(#sb-arrowhead)");
    svg.appendChild(p);
  }

  function activateArrow(id) {
    const a = document.getElementById(id);
    if (a) a.classList.add("sb-arrow--active");

  function dialogueAppend(principalId, fromLabel, directionLabel, bodyText, showSpinner) {
    const body = $("sb-dp-body");
    if (!body) return null;

    const slot = principalColorSlot(principalId);
    const row = elem("div", { className: "sb-dm sb-dm--slot-" + slot });

    const meta = elem("div", { className: "sb-dm-meta" });
    const now = new Date();
    const hh = pad2(now.getHours()), mm = pad2(now.getMinutes()), ss = pad2(now.getSeconds());
    meta.appendChild(elem("span", { className: "sb-dm-time", text: hh + ":" + mm + ":" + ss }));
    meta.appendChild(elem("span", { className: "sb-dm-from", text: fromLabel }));
    row.appendChild(meta);

    const bubble = elem("div", { className: "sb-dm-bubble" });
    bubble.appendChild(elem("span", { className: "sb-dm-direction", text: directionLabel }));
    bubble.appendChild(document.createTextNode(bodyText));

    if (showSpinner) {
      const spin = document.createElement("span");
      spin.className = "sb-dm-spinner";
      spin.setAttribute("aria-hidden", "true");
      bubble.appendChild(spin);
    }

    row.appendChild(bubble);
    body.appendChild(row);
    requestAnimationFrame(() => requestAnimationFrame(() => row.classList.add("sb-dm--visible")));
    return row;
  }

  /* ===================================================================
   *  Calendar deltas

  function moveSlot(pid, time) {
    const key = slotKey(pid, time);
    const slot = document.querySelector('[data-slot="' + cssEscape(key) + '"]');
    if (!slot) return;
    slot.classList.add("sb-slot-moving-out");
    setTimeout(() => { if (slot.parentNode) slot.parentNode.removeChild(slot); }, 400);
  }

  function gainSlot(pid, time, title, attendees) {
    const cal = document.getElementById("sb-cal-" + slugify(pid));
    if (!cal) return;
    // Remove any "no events" placeholder
    const empty = cal.querySelector(".sb-cal-empty");
    if (empty) empty.remove();

    const node = elem("div", { className: "sb-cal-event sb-slot-appearing booked", attrs: { "data-slot": slotKey(pid, time) } });
    node.appendChild(elem("span", { className: "time", text: time }));
    const inner = elem("div");
    inner.appendChild(elem("div", { className: "title", text: title }));
    if (attendees) inner.appendChild(elem("div", { className: "attendees", text: attendees }));
    node.appendChild(inner);
    cal.appendChild(node);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      node.classList.remove("sb-slot-appearing");
      node.classList.add("sb-slot-appeared");
    }));
  }

  /* ===================================================================
   *  Payload-panel (scoped disclosure visualization)
   * =================================================================== */
  function revealScopedPayload(pid, allow, block, hash) {
    const pp = document.getElementById("sb-pp-" + slugify(pid));
    if (!pp) return;
    const lbl = document.querySelector('[data-pid="' + cssEscape(pid) + '"] [data-role="pp-label"]');
    if (lbl) lbl.classList.remove("sb-hidden");
    pp.classList.remove("sb-hidden");
    clearChildren(pp);

    allow.forEach(k => {
      const row = elem("div", { className: "sb-pp-row" });
      row.appendChild(elem("span", { className: "sb-pp-k", text: k }));
      row.appendChild(elem("span", { className: "sb-pp-v", text: prettyAllowValue(k) }));
      pp.appendChild(row);
    });
    block.forEach(k => {
      const row = elem("div", { className: "sb-pp-row sb-pp-blocked" });
      row.appendChild(elem("span", { className: "sb-pp-k", text: k }));
      row.appendChild(elem("span", { className: "sb-pp-v", text: "— blocked —" }));
      pp.appendChild(row);
    });
    pp.appendChild(elem("div", { className: "sb-pp-hash", text: "scoped hash · " + String(hash || "").slice(0, 16) + "…" }));
  }

  function prettyAllowValue(k) {
    if (k === "candidates") return "3 slots";
    if (k === "duration_minutes") return "30";
    if (k === "constraint_hints") return "{ tz: \"Europe/Lisbon\" }";
    return "(scoped)";

  /* ===================================================================

  function buildSteps(labels) {
    const ind = $("sb-step-indicator");
    clearChildren(ind);
    labels.forEach((lbl, i) => {
      const s = elem("div", { className: "sb-step", attrs: { "data-step": String(i + 1) } });
      s.appendChild(elem("span", { className: "n", text: toRoman(i + 1) }));
      s.appendChild(elem("span", { className: "lbl", text: lbl }));
      ind.appendChild(s);
    });
    ind.classList.remove("sb-hidden");
  }

  function setStep(n) {
    document.querySelectorAll(".sb-step").forEach(el => {
      const s = parseInt(el.dataset.step, 10);
      el.classList.toggle("active", s === n);
      el.classList.toggle("done",   s < n);
    });
  }

  function setStatus(msg) {
    const bar = $("sb-status-bar");
    bar.classList.remove("sb-hidden");
    bar.textContent = msg;
  }

  function toRoman(n) {
    const r = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
    return r[n] || String(n);
  }

   *  Ledger blocks

  function buildLedgerBlock(principalIds) {
    const isThree = principalIds.length === 3;
    const block = elem("div", { className: "sb-ledger-block" + (isThree ? " sb-ledger-block--3" : "") });
    principalIds.forEach(pid => {
      const p = principalById(pid);
      if (!p) return;
      const led = elem("div", { className: "sb-ledger", attrs: { id: "sb-ledger-" + slugify(pid) } });
      const head = elem("div", { className: "sb-ledger-head" });
      head.appendChild(elem("span", { className: "sb-ledger-who", text: p.displayName }));
      head.appendChild(elem("span", { className: "sb-ledger-label", text: "residue" }));
      led.appendChild(head);
      const empty = elem("div", { className: "sb-ledger-empty", text: "— awaiting first entry —" });

  function appendLedgerEntry(pid, { seq, ts, action, op, actor, counterpart, hash }) {
    const led = document.getElementById("sb-ledger-" + slugify(pid));
    if (!led) return;
    const empty = led.querySelector(".sb-ledger-empty");
    if (empty) empty.remove();

    const entry = elem("div", { className: "sb-ledger-entry" });
    entry.appendChild(elem("span", { className: "seq", text: String(seq).padStart(2, "0") + "." }));
    const body = elem("div", { className: "body" });

    function row(k, v, vClass) {
      const r = elem("div", { className: "row" });
      r.appendChild(elem("span", { className: "k", text: k }));
      r.appendChild(elem("span", { className: "v" + (vClass ? " " + vClass : ""), text: v }));
      return r;
    }
    body.appendChild(row("action_type", action, action === "emit" ? "emit" : "receive"));
    body.appendChild(row("operation", op));
    body.appendChild(row("actor", actor));
    body.appendChild(row("counterpart", counterpart));
    body.appendChild(row("timestamp", ts));
    body.appendChild(row("payload_hash", hash, "hash"));
    entry.appendChild(body);
    led.appendChild(entry);
  }

  /* ===================================================================
   *  Fire request — animation mode
   * =================================================================== */
  async function fireRequest() {
    if (SB_STATE.runInProgress) return;
    SB_STATE.runInProgress = true;
    updateFireState();

    const senderId    = $("sb-req-sender").value;
    const recipientId = $("sb-req-recipient").value;
    const duration    = parseInt($("sb-req-duration").value, 10) || 30;
    const note        = $("sb-req-note").value || "";

    // Topology decision: if recipient has a "blocking" event in their calendar
    // AND there's a third principal who is also an attendee of that event,
    // we run a 3-party cascade. Otherwise a 2-party run.
    const recipient = principalById(recipientId);
    const sender    = principalById(senderId);
    if (!sender || !recipient) {
      SB_STATE.runInProgress = false; updateFireState(); return;
    }

    const blockingEv = (recipient.calendar || []).find(e => e.isBlocking);
    let cascadePartner = null;
    if (blockingEv && blockingEv.attendees) {
      const want = String(blockingEv.attendees).trim().toLowerCase();
      cascadePartner = SB_STATE.principals.find(p =>
        p.id !== sender.id && p.id !== recipient.id &&
        (p.displayName.toLowerCase() === want || p.id.startsWith(want + "@"))
      ) || null;
    }

    const principalIds = cascadePartner
      ? [sender.id, recipient.id, cascadePartner.id]
      : [sender.id, recipient.id];

    try {
      if (cascadePartner) {
        await runThreeParty(sender, recipient, cascadePartner, duration);
      } else {
        await runTwoParty(sender, recipient, duration);
      }
    } catch (err) {
      renderAbort(err && err.message ? err.message : "Unknown error.");
    } finally {
      SB_STATE.runInProgress = false;
      updateFireState();
    }
  }

  /* ===================================================================
   *  Two-party choreography
   * =================================================================== */
  async function runTwoParty(sender, recipient, duration) {
    const root = $("sb-stage-root");
    clearChildren(root);

    const principalIds = [sender.id, recipient.id];
    root.appendChild(buildNarrativeBand());
    root.appendChild(buildStageGrid(principalIds));
    root.appendChild(buildExchangeBadgesHost());
    root.appendChild(buildDialoguePanel());
    root.appendChild(buildLedgerBlock(principalIds));

    buildSteps(["build", "scope", "cross", "match", "seal", "fit", "update"]);
    setStatus("two-party run · " + sender.displayName + " → " + recipient.displayName);
    $("sb-abort-banner").classList.remove("sb-abort-visible");
    hideTesseraFit();

    // Hashes
    const h = {
      propEmit:  fakeHash(11 + (sender.colorSlot+1) * 17),
      propRecv:  fakeHash(13 + (recipient.colorSlot+1) * 19),
      acptEmit:  fakeHash(23 + (recipient.colorSlot+1) * 29),
      acptRecv:  fakeHash(29 + (sender.colorSlot+1) * 31),
      richScope: fakeHash(41 + duration),
    };
    const taskId = "task_" + fakeHash(7).slice(0, 12);

    // Step I — build
    setStep(1);
    narrativeBeat(sender.displayName + " asks their agent for a meeting with " + recipient.displayName + ". The agent builds a proposal — rich on its side, scoped before it leaves.");
    dialogueThinking(sender.id, sender.displayName + " · agent", "intent",
      "Find a " + duration + "-min slot with " + recipient.displayName + ". Builds proposal_v1: candidates, durations, blocked fields stripped per policy.");
    await sleep(1100);

    // Step II — scope
    setStep(2);
    narrativeBeat("Policy is enforced before the wire: " + sender.displayName + "'s rich payload narrows to a scoped projection. The full version stays home.");
    revealScopedPayload(sender.id, sender.policy.outboundAllow, sender.policy.outboundBlock, h.richScope);
    await sleep(900);

    // Step III — cross
    setStep(3);
    activateArrow("sb-arrow-fwd");
    narrativeBeat("The scoped payload crosses the wire. " + recipient.displayName + " receives only what " + sender.displayName + "'s policy permitted.");
    dialogueAppend(sender.id, sender.displayName + " · agent", "→ proposal_v1",
      "candidates: 3 slots · duration: " + duration + " min · constraint_hints: { tz: \"Europe/Lisbon\" }. Titles + attendees not enclosed.", false);
    await sleep(900);
    revealScopedPayload(recipient.id, recipient.policy.inboundAllow, [], h.propRecv);
    await sleep(700);

    // Step IV — match
    setStep(4);
    narrativeBeat(recipient.displayName + "'s agent scans the candidates, picks the slot that fits.");
    dialogueAppend(recipient.id, recipient.displayName + " · agent", "← acceptance",
      "Accepts 13:00 — the only candidate clear of " + recipient.displayName + "'s existing blocks.", false);
    await sleep(900);

    // Step V — seal
    setStep(5);
    activateArrow("sb-arrow-back");
    appendExchangeBadge("A", sender.displayName, recipient.displayName, h.propEmit, h.acptEmit, taskId);
    appendLedgerEntry(sender.id,    { seq: 1, ts: nowTs(), action: "emit",    op: "proposal_v1",   actor: sender.id,    counterpart: recipient.id, hash: h.propEmit });
    appendLedgerEntry(recipient.id, { seq: 1, ts: nowTs(), action: "receive", op: "proposal_v1",   actor: recipient.id, counterpart: sender.id,    hash: h.propRecv });
    await sleep(550);
    appendLedgerEntry(recipient.id, { seq: 2, ts: nowTs(), action: "emit",    op: "acceptance_v1", actor: recipient.id, counterpart: sender.id,    hash: h.acptEmit });
    appendLedgerEntry(sender.id,    { seq: 2, ts: nowTs(), action: "receive", op: "acceptance_v1", actor: sender.id,    counterpart: recipient.id, hash: h.acptRecv });
    await sleep(700);

    // Step VI — fit
    setStep(6);
    narrativeBeat("Two ledgers, two signed entries each, one matching scoped hash. The tesserae fit.");
    showTesseraFit("tessera fit · trust verified");
    await sleep(1700);
    hideTesseraFit();

    // Step VII — update
    setStep(7);
    narrativeBeat("Both calendars gain a signed, agreed meeting. No titles or attendees ever crossed the wire.");
    gainSlot(sender.id,    "13:00", "meeting with " + recipient.displayName, "signed · 30 min");
    gainSlot(recipient.id, "13:00", "meeting with " + sender.displayName,    "signed · 30 min");
    setStatus("run complete · " + sender.displayName + " ↔ " + recipient.displayName);
  }

  /* ===================================================================
   *  Three-party cascading reschedule choreography
   * =================================================================== */
  async function runThreeParty(sender, pivot, third, duration) {
    const root = $("sb-stage-root");
    clearChildren(root);

    const principalIds = [sender.id, pivot.id, third.id];
    root.appendChild(buildNarrativeBand());
    root.appendChild(buildStageGrid(principalIds));
    root.appendChild(buildExchangeBadgesHost());
    root.appendChild(buildDialoguePanel());
    root.appendChild(buildLedgerBlock(principalIds));

    buildSteps(["build", "scope", "cross", "reason", "cascade", "sub-accept", "seal", "fit", "update"]);
    setStatus("three-party cascade · " + sender.displayName + " → " + pivot.displayName + " ↻ " + third.displayName);
    $("sb-abort-banner").classList.remove("sb-abort-visible");
    hideTesseraFit();

    const h = {
      propEmit:    fakeHash(11 + (sender.colorSlot+1) * 17),
      propRecv:    fakeHash(13 + (pivot.colorSlot+1) * 19),
      subPropEmit: fakeHash(23 + (pivot.colorSlot+1) * 29),
      subPropRecv: fakeHash(29 + (third.colorSlot+1) * 31),
      subAcptEmit: fakeHash(37 + (third.colorSlot+1) * 41),
      subAcptRecv: fakeHash(43 + (pivot.colorSlot+1) * 47),
      acptEmit:    fakeHash(53 + (pivot.colorSlot+1) * 59),
      acptRecv:    fakeHash(61 + (sender.colorSlot+1) * 67),
      richScope:   fakeHash(71 + duration),
    };
    const taskId1 = "task_" + fakeHash(7).slice(0, 12);
    const taskId2 = "task_" + fakeHash(13).slice(0, 12);

    // I — build
    setStep(1);
    narrativeBeat(sender.displayName + " asks their agent for a meeting with " + pivot.displayName + ". The agent builds a scoped proposal.");
    dialogueThinking(sender.id, sender.displayName + " · agent", "intent",
      "Find a " + duration + "-min slot with " + pivot.displayName + ". Builds proposal_v1, strips blocked fields per policy.");
    await sleep(1000);

    // II — scope
    setStep(2);
    narrativeBeat("Scoped projection assembled. The rich payload stays on " + sender.displayName + "'s side.");
    revealScopedPayload(sender.id, sender.policy.outboundAllow, sender.policy.outboundBlock, h.richScope);
    await sleep(800);

    // III — cross (sender → pivot)
    setStep(3);
    activateArrow("sb-arrow-ab");
    narrativeBeat(sender.displayName + "'s scoped proposal reaches " + pivot.displayName + ". The desired slot collides with a meeting " + pivot.displayName + " already has with " + third.displayName + ".");
    dialogueAppend(sender.id, sender.displayName + " · agent", "→ proposal_v1",
      "candidates: 3 slots · duration: " + duration + " min · constraint_hints: { tz: \"Europe/Lisbon\" }.", false);
    await sleep(900);
    revealScopedPayload(pivot.id, pivot.policy.inboundAllow, [], h.propRecv);
    await sleep(700);

    // IV — reason (pivot)
    setStep(4);
    narrativeBeat(pivot.displayName + "'s agent reasons: a held meeting with " + third.displayName + " blocks the natural slot. Propose moving the prior meeting forward.");
    const blockingEv = (pivot.calendar || []).find(e => e.isBlocking) || { time: "14:00", title: "project-sync", attendees: third.displayName };
    showReasoningTrace(pivot.id, {
      requestedSlot:          "13:00",
      blockingEventTitle:     blockingEv.title || "project-sync",
      blockingEventAttendee:  blockingEv.attendees || third.displayName,
      proposedNewSlot:        "16:00",
      reason: pivot.reasoner.provider === "scripted"
        ? "Scripted reasoner: holding meeting with " + third.displayName + " can be shifted to 16:00 (after " + pivot.displayName + "'s 15:30 1-on-1 ends). Both parties keep duration."
        : (pivot.reasoner.provider + " · " + (pivot.reasoner.model || "(model unset)") + " — proposes 16:00 as the lowest-disruption fit (synthetic narration)."
        )
    });
    dialogueThinking(pivot.id, pivot.displayName + " · agent", "reasoning",
      "the requested slot collides with my prior meeting · proposing a cascade · holding 13:00 pending sub-accept from " + third.displayName);
    await sleep(1500);

    // V — cascade (pivot → third)
    setStep(5);
    activateArrow("sb-arrow-bc");
    narrativeBeat(pivot.displayName + " opens a sub-exchange with " + third.displayName + ", asking to slide their meeting from 14:00 to 16:00.");
    dialogueAppend(pivot.id, pivot.displayName + " · agent", "→ reschedule_v1",
      "current: 14:00 · proposed: 16:00 · scope: project-sync. Titles + counter-attendees blocked per policy.", false);
    await sleep(900);
    revealScopedPayload(third.id, third.policy.inboundAllow, [], h.subPropRecv);
    await sleep(700);

    // VI — sub-accept (third → pivot)
    setStep(6);
    activateArrow("sb-arrow-cb");
    narrativeBeat(third.displayName + " agrees. The original meeting moves forward; the 14:00 slot is released.");
    dialogueAppend(third.id, third.displayName + " · agent", "← sub-acceptance",
      "Accept reschedule to 16:00. " + pivot.displayName + " now holds a free 14:00 slot.", false);
    await sleep(900);

    // VII — seal (pivot → sender confirmation)
    setStep(7);
    activateArrow("sb-arrow-ba");
    stopReasoningSpinner(pivot.id);
    dialogueAppend(pivot.id, pivot.displayName + " · agent", "← acceptance",
      "Accept 14:00 — sub-exchange with " + third.displayName + " freed the slot. Cascade depth ≤ " + pivot.policy.maxCascadeDepth + ".", false);

    appendExchangeBadge("A", sender.displayName, pivot.displayName, h.propEmit,   h.acptEmit,   taskId1);
    appendExchangeBadge("B", pivot.displayName,  third.displayName, h.subPropEmit, h.subAcptEmit, taskId2);
    appendExchangeBadge("C", sender.displayName, pivot.displayName, h.propEmit,   h.acptEmit,   taskId1);

    appendLedgerEntry(sender.id, { seq: 1, ts: nowTs(), action: "emit",    op: "proposal_v1",   actor: sender.id, counterpart: pivot.id, hash: h.propEmit });
    appendLedgerEntry(pivot.id,  { seq: 1, ts: nowTs(), action: "receive", op: "proposal_v1",   actor: pivot.id,  counterpart: sender.id, hash: h.propRecv });
    await sleep(450);
    appendLedgerEntry(pivot.id,  { seq: 2, ts: nowTs(), action: "emit",    op: "reschedule_v1", actor: pivot.id,  counterpart: third.id, hash: h.subPropEmit });
    appendLedgerEntry(third.id,  { seq: 1, ts: nowTs(), action: "receive", op: "reschedule_v1", actor: third.id,  counterpart: pivot.id, hash: h.subPropRecv });
    await sleep(450);
    appendLedgerEntry(third.id,  { seq: 2, ts: nowTs(), action: "emit",    op: "sub_acceptance_v1", actor: third.id, counterpart: pivot.id, hash: h.subAcptEmit });
    appendLedgerEntry(pivot.id,  { seq: 3, ts: nowTs(), action: "receive", op: "sub_acceptance_v1", actor: pivot.id, counterpart: third.id, hash: h.subAcptRecv });
    await sleep(450);
    appendLedgerEntry(pivot.id,  { seq: 4, ts: nowTs(), action: "emit",    op: "acceptance_v1", actor: pivot.id,  counterpart: sender.id, hash: h.acptEmit });
    appendLedgerEntry(sender.id, { seq: 2, ts: nowTs(), action: "receive", op: "acceptance_v1", actor: sender.id, counterpart: pivot.id,  hash: h.acptRecv });
    await sleep(800);

    // VIII — fit
    setStep(8);
    narrativeBeat("Three ledgers, six signed entries, two matching scoped hashes. The cascade closes.");
    showTesseraFit("2 fits · cascade complete · trust verified");
    await sleep(1900);
    hideTesseraFit();

    // IX — update
    setStep(9);
    narrativeBeat("Calendars settle. " + sender.displayName + " gains 14:00 with " + pivot.displayName + "; " + pivot.displayName + " and " + third.displayName + " slide their prior meeting to 16:00. No titles, no attendee emails ever crossed the wire.");
    if (blockingEv) {
      moveSlot(pivot.id, blockingEv.time);
      moveSlot(third.id, blockingEv.time);
    }
    await sleep(500);
    gainSlot(sender.id, "14:00", "meeting with " + pivot.displayName, "signed · " + duration + " min");
    gainSlot(pivot.id,  "14:00", "meeting with " + sender.displayName, "signed · " + duration + " min");
    gainSlot(pivot.id,  "16:00", "project-sync (moved)", "with " + third.displayName);
    gainSlot(third.id,  "16:00", "project-sync (moved)", "with " + pivot.displayName);
    setStatus("cascade complete · " + sender.displayName + " ↔ " + pivot.displayName + " · " + pivot.displayName + " ↔ " + third.displayName);
  }

  function nowTs() {
    const d = new Date();
    return d.toISOString().replace("T", " ").slice(0, 19) + "Z";
  }

  /* ===================================================================
   *  Abort
   * =================================================================== */
  function renderAbort(reason) {
    const ban = $("sb-abort-banner");
    $("sb-abort-reason").textContent = reason || "Run aborted.";
    ban.classList.add("sb-abort-visible");
    narrativeBeat("Run aborted. " + (reason || ""));
  }

  /* ===================================================================
   *  Reset session
   * =================================================================== */
  function resetSession() {
    try { localStorage.removeItem(LS_KEY_PRINCIPALS); } catch (_) {}
    SB_STATE.principals = seedDefaultPrincipals();
    SB_STATE.openCards.clear();
    SB_STATE.apiKeys = {};
    persistSession();
    renderEditor();
    setStageIdle();
  }

  /* ===================================================================
   *  Init
   * =================================================================== */
  function init() {
    if (!hydrateSession()) {
      SB_STATE.principals = seedDefaultPrincipals();
      persistSession();
    }
    renderEditor();
    hydrateRequestForm();
    setStageIdle();

    $("sb-fire-btn").addEventListener("click", fireRequest);
    $("sb-req-sender").addEventListener("change", () => {
      if ($("sb-req-sender").value === $("sb-req-recipient").value) {
        const alt = SB_STATE.principals.find(p => p.id !== $("sb-req-sender").value);
        if (alt) $("sb-req-recipient").value = alt.id;
      }
      updateFireState();
    });
    $("sb-req-recipient").addEventListener("change", updateFireState);
    $("sb-add-principal-btn").addEventListener("click", addPrincipal);
    $("sb-reset-btn").addEventListener("click", resetSession);
    $("sb-abort-reset").addEventListener("click", () => setStageIdle());

    probeBackend();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
