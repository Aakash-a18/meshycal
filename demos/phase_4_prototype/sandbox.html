<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MeshyCal — sandbox · R&amp;D mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" />
<style>

/* =========================================================================
 *  Tokens — duplicated from index.html so sandbox.html stands alone.
 * ========================================================================= */
:root {
  --paper:        hsl(40 32% 93%);
  --paper-deep:   hsl(38 26% 87%);
  --paper-dim:    hsl(34 18% 78%);
  --ink:          hsl(222 28% 11%);
  --ink-soft:     hsl(222 18% 28%);
  --ink-mute:     hsl(222 10% 46%);
  --rule:         hsl(34 14% 70%);

  --terracotta:   hsl(13 60% 50%);
  --terracotta-deep: hsl(10 55% 36%);
  --jade:         hsl(155 30% 33%);
  --jade-deep:    hsl(155 35% 24%);
  --gold:         hsl(40 70% 53%);
  --gold-deep:    hsl(35 65% 38%);

  --slot-0-bg:    hsl(40 55% 68%);
  --slot-1-bg:    hsl(155 30% 33%);
  --slot-2-bg:    hsl(13 60% 50%);
  --slot-3-bg:    hsl(240 25% 52%);
  --slot-4-bg:    hsl(30 55% 42%);
  --slot-5-bg:    hsl(270 20% 45%);

  --display: "Fraunces", "EB Garamond", serif;
  --body:    "Newsreader", "EB Garamond", Georgia, serif;
  --mono:    "IBM Plex Mono", "Courier New", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "ss01", "kern";
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    radial-gradient(circle at 18% 30%, hsl(34 25% 60% / 0.045) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, hsl(15 30% 50% / 0.04) 0%, transparent 50%),
    repeating-linear-gradient(
      45deg,
      transparent 0 3px,
      hsl(34 20% 40% / 0.012) 3px 4px
    );
  mix-blend-mode: multiply;
}

a { color: var(--terracotta-deep); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }

/* =========================================================================
 *  Header bar
 * ========================================================================= */
.sb-header {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 24px;
  padding: 18px 32px 18px;
  border-bottom: 1px solid var(--ink);
  background: var(--paper);
}
.sb-header-brand {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--ink);
}
.sb-header-eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
  justify-self: center;
  text-align: center;
}
.sb-header-nav {
  display: flex;
  align-items: center;
  gap: 18px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.sb-back-link {
  color: var(--ink-soft);
}
.sb-session-badge {
  font-family: var(--mono);
  font-size: 10px;
  padding: 5px 10px;
  border: 1px solid hsl(40 20% 60%);
  letter-spacing: 0.08em;
  color: hsl(40 25% 38%);
  text-transform: none;
}
.sb-reset-btn {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: transparent;
  color: var(--ink-soft);
  border: 1px solid var(--rule);
  padding: 6px 12px;
  cursor: pointer;
  transition: border-color 150ms ease, color 150ms ease;
}
.sb-reset-btn:hover { border-color: var(--terracotta); color: var(--terracotta-deep); }

/* =========================================================================
 *  Workspace (editor | stage)
 * ========================================================================= */
.sb-workspace {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 360px 1fr;
  min-height: calc(100vh - 64px);
}

.sb-editor {
  border-right: 1px solid var(--rule);
  background: hsl(40 28% 91%);
  padding: 18px 18px 96px;
  overflow-y: auto;
  max-height: calc(100vh - 64px);
  position: sticky;
  top: 0;
}

.sb-editor-eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin: 4px 4px 16px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.sb-editor-eyebrow .count {
  font-family: var(--display);
  font-style: italic;
  font-size: 16px;
  letter-spacing: -0.02em;
  text-transform: none;
  color: var(--ink-soft);
}

.sb-editor-list {
  display: flex;
  flex-direction: column;
}

/* =========================================================================
 *  Principal card
 * ========================================================================= */
.sb-card {
  border-bottom: 1px solid hsl(34 18% 76%);
  padding: 14px 6px 14px;
  position: relative;
}
.sb-card:first-child { border-top: 1px solid hsl(34 18% 76%); }

.sb-card-head {
  display: grid;
  grid-template-columns: 36px 1fr auto;
  gap: 12px;
  align-items: center;
  cursor: pointer;
  user-select: none;
}

.sb-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--display);
  font-style: italic;
  font-size: 18px;
  font-weight: 400;
  letter-spacing: -0.02em;
  flex-shrink: 0;
}
.sb-avatar--slot-0 { background: var(--slot-0-bg); color: var(--ink); }
.sb-avatar--slot-1 { background: var(--slot-1-bg); color: var(--paper); }
.sb-avatar--slot-2 { background: var(--slot-2-bg); color: var(--paper); }
.sb-avatar--slot-3 { background: var(--slot-3-bg); color: var(--paper); }
.sb-avatar--slot-4 { background: var(--slot-4-bg); color: var(--paper); }
.sb-avatar--slot-5 { background: var(--slot-5-bg); color: var(--paper); }

.sb-card-id {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.sb-card-name {
  font-family: var(--display);
  font-style: italic;
  font-size: 18px;
  font-weight: 400;
  color: var(--ink);
  line-height: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sb-card-sub {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 0.04em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sb-card-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}
.sb-reasoner-badge {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-mute);
  border: 1px solid var(--rule);
  padding: 2px 6px;
}
.sb-reasoner-badge--anthropic { color: var(--terracotta-deep); border-color: var(--terracotta); }
.sb-reasoner-badge--openai    { color: var(--jade-deep);       border-color: var(--jade); }
.sb-reasoner-badge--compatible{ color: var(--gold-deep);       border-color: var(--gold); }

.sb-card-event-count {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-mute);
}

.sb-card-chevron {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-mute);
  transition: transform 200ms ease;
}
.sb-card--open .sb-card-chevron { transform: rotate(90deg); color: var(--ink); }

.sb-card-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 260ms ease;
}
.sb-card--open .sb-card-body { max-height: 2200px; }

.sb-card-section {
  margin-top: 16px;
  border-top: 1px dashed hsl(34 18% 72%);
  padding-top: 14px;
}
.sb-card-section-eyebrow {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 8px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.sb-card-section-eyebrow .hint {
  font-family: var(--display);
  font-style: italic;
  font-size: 12px;
  letter-spacing: -0.01em;
  text-transform: none;
  color: var(--ink-mute);
}

/* Identity */
.sb-name-input {
  width: 100%;
  font-family: var(--display);
  font-style: italic;
  font-size: 22px;
  font-weight: 400;
  background: transparent;
  border: none;
  border-bottom: 1px dashed transparent;
  padding: 2px 0 4px;
  outline: none;
  color: var(--ink);
  transition: border-color 150ms ease;
}
.sb-name-input:hover  { border-bottom-color: hsl(34 18% 72%); }
.sb-name-input:focus  { border-bottom-color: var(--ink-soft); }
.sb-pid-row {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-mute);
  letter-spacing: 0.04em;
  margin-top: 4px;
}
.sb-delete-link {
  display: inline-block;
  margin-top: 10px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--terracotta-deep);
  cursor: pointer;
  border: none;
  background: transparent;
  padding: 0;
}
.sb-delete-link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* Inputs (shared) */
.sb-card input[type="text"],
.sb-card input[type="time"],
.sb-card input[type="number"],
.sb-card input[type="password"],
.sb-card input[type="url"],
.sb-card input[type="datetime-local"],
.sb-card select {
  font-family: var(--mono);
  font-size: 11.5px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 0;
  color: var(--ink);
  padding: 5px 8px;
  outline: none;
  transition: border-color 150ms ease;
}
.sb-card input:focus, .sb-card select:focus {
  border-color: var(--ink-soft);
}
.sb-card input::placeholder { color: var(--ink-mute); font-style: italic; }

/* Calendar editor */
.sb-event-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sb-event-row {
  display: grid;
  grid-template-columns: 60px 56px 1fr 16px;
  gap: 6px;
  align-items: center;
  background: var(--paper);
  padding: 5px 6px;
  border: 1px solid hsl(34 18% 80%);
}
.sb-event-row input[type="text"]:nth-of-type(1) {
  font-family: var(--body);
  font-style: italic;
  font-size: 12.5px;
  border: none;
  background: transparent;
  padding: 2px 4px;
}
.sb-event-attendees-row {
  grid-column: 1 / -1;
  margin-top: 4px;
}
.sb-event-attendees-row input {
  width: 100%;
  font-size: 10px;
  border: none;
  background: transparent;
  color: var(--ink-mute);
  padding: 2px 4px;
}
.sb-event-remove {
  background: transparent;
  border: none;
  color: var(--ink-mute);
  font-family: var(--mono);
  font-size: 14px;
  cursor: pointer;
  padding: 0;
  line-height: 1;
}
.sb-event-remove:hover { color: var(--terracotta-deep); }

.sb-add-event-btn,
.sb-add-principal-btn {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  background: transparent;
  color: var(--ink-soft);
  border: 1px dashed var(--rule);
  padding: 8px 10px;
  width: 100%;
  cursor: pointer;
  margin-top: 10px;
  transition: border-color 150ms ease, color 150ms ease, background 150ms ease;
}
.sb-add-event-btn:hover,
.sb-add-principal-btn:hover {
  border-color: var(--ink-soft);
  color: var(--ink);
  background: hsl(40 28% 88%);
}
.sb-add-event-btn:disabled,
.sb-add-principal-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.sb-add-principal-btn { margin-top: 18px; }

/* Archetype auto-fill */
.sb-archetype-row {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
  padding: 8px 10px;
  background: hsl(40 28% 88%);
  border: 1px dashed hsl(34 18% 68%);
}
.sb-archetype-label {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-mute);
  white-space: nowrap;
}
.sb-archetype-select {
  width: 100%;
  font-family: var(--mono);
  font-size: 11.5px;
  background: var(--paper);
  border: 1px solid var(--rule);
  color: var(--ink);
  padding: 5px 8px;
  outline: none;
}
.sb-archetype-select:focus { border-color: var(--ink-soft); }

.sb-empty-events {
  font-family: var(--body);
  font-style: italic;
  font-size: 12.5px;
  color: var(--ink-mute);
  text-align: center;
  padding: 14px 8px;
  border: 1px dashed hsl(34 18% 80%);
  list-style: none;
  background: hsl(40 28% 91%);
}

/* Per-event "hard block" toggle */
.sb-event-block-row {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 0.04em;
  padding: 4px 4px 0;
  cursor: pointer;
  user-select: none;
}
.sb-event-block-row input {
  margin: 0;
  accent-color: var(--terracotta-deep);
  cursor: pointer;
}
.sb-event-block-row[data-on="true"] {
  color: var(--terracotta-deep);
  font-weight: 500;
}
.sb-event-block-row[data-on="true"]::before {
  content: "● ";
  color: var(--terracotta);
}

/* Plain-English privacy panel */
.sb-friendly-policy { display: flex; flex-direction: column; gap: 0; }
.sb-friendly-policy-intro {
  font-family: var(--body);
  font-style: italic;
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink-soft);
  margin: 0 0 10px;
}
.sb-toggle-row {
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 12px;
  align-items: start;
  padding: 10px 0;
  border-bottom: 1px dashed hsl(34 18% 80%);
  cursor: pointer;
  user-select: none;
}
.sb-toggle-row:last-child { border-bottom: none; }
.sb-toggle-row:hover { background: hsl(40 28% 89%); }
.sb-toggle-switch {
  position: relative;
  width: 32px;
  height: 18px;
  background: hsl(34 14% 76%);
  border: 1px solid hsl(34 14% 60%);
  border-radius: 12px;
  transition: background 180ms ease, border-color 180ms ease;
  margin-top: 2px;
  flex-shrink: 0;
}
.sb-toggle-switch::after {
  content: "";
  position: absolute;
  top: 1px; left: 1px;
  width: 14px; height: 14px;
  background: var(--paper);
  border-radius: 50%;
  transition: transform 180ms ease;
  box-shadow: 0 1px 0 hsl(34 20% 50% / 0.3);
}
.sb-toggle-row[data-on="true"] .sb-toggle-switch {
  background: var(--jade);
  border-color: var(--jade-deep);
}
.sb-toggle-row[data-on="true"] .sb-toggle-switch::after {
  transform: translateX(14px);
}
.sb-toggle-label {
  font-family: var(--body);
  font-size: 13.5px;
  line-height: 1.4;
  color: var(--ink);
}
.sb-toggle-label .small {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--ink-mute);
  margin-top: 3px;
  font-style: normal;
}
.sb-toggle-label .field-code {
  font-family: var(--mono);
  font-size: 9.5px;
  color: hsl(40 25% 42%);
  background: hsl(40 28% 86%);
  padding: 1px 5px;
  letter-spacing: 0.04em;
}

.sb-cascade-block {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px dashed hsl(34 18% 72%);
}
.sb-cascade-title {
  font-family: var(--body);
  font-style: italic;
  font-size: 13px;
  color: var(--ink);
  margin: 0 0 10px;
  line-height: 1.4;
}
.sb-cascade-radios { display: flex; flex-direction: column; gap: 2px; }
.sb-cascade-opt {
  display: grid;
  grid-template-columns: 16px 1fr;
  gap: 10px;
  align-items: start;
  padding: 6px 6px;
  cursor: pointer;
  user-select: none;
  font-family: var(--body);
  font-size: 13px;
  color: var(--ink);
}
.sb-cascade-opt:hover { background: hsl(40 28% 89%); }
.sb-cascade-opt input[type="radio"] {
  margin-top: 4px;
  accent-color: var(--ink);
  cursor: pointer;
}
.sb-cascade-opt .small {
  display: block;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.06em;
  color: var(--ink-mute);
  margin-top: 2px;
  text-transform: lowercase;
}

.sb-policy-advanced {
  margin-top: 16px;
  border-top: 1px dashed hsl(34 18% 72%);
  padding-top: 12px;
}
.sb-policy-advanced summary {
  cursor: pointer;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
  padding: 4px 0;
  list-style: none;
  transition: color 150ms ease;
}
.sb-policy-advanced summary::-webkit-details-marker { display: none; }
.sb-policy-advanced summary::before {
  content: "▸";
  display: inline-block;
  margin-right: 8px;
  transition: transform 150ms ease;
}
.sb-policy-advanced[open] summary::before { transform: rotate(90deg); }
.sb-policy-advanced summary:hover { color: var(--ink); }
.sb-policy-advanced-body {
  padding: 10px 0 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.sb-policy-advanced-hint {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-mute);
  font-style: italic;
  line-height: 1.5;
  margin-bottom: 6px;
}

/* Legacy policy styles (still used inside the advanced disclosure) */
.sb-policy-block { display: grid; gap: 10px; }
.sb-policy-label {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 4px;
}
.sb-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
  background: var(--paper);
  border: 1px solid var(--rule);
  padding: 6px;
  min-height: 30px;
}
.sb-tag-chip {
  font-family: var(--mono);
  font-size: 10px;
  background: hsl(155 30% 33% / 0.14);
  color: var(--jade-deep);
  border: 1px solid hsl(155 30% 33% / 0.4);
  padding: 2px 6px 2px 8px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.sb-tag-chip--block {
  background: hsl(13 60% 50% / 0.12);
  color: var(--terracotta-deep);
  border-color: hsl(13 60% 50% / 0.5);
}
.sb-tag-chip-x {
  font-size: 10px;
  cursor: pointer;
  color: inherit;
  opacity: 0.6;
}
.sb-tag-chip-x:hover { opacity: 1; }
.sb-tag-input {
  border: none;
  background: transparent;
  flex: 1;
  min-width: 80px;
  font-family: var(--mono);
  font-size: 11px;
  outline: none;
  padding: 1px 2px;
  color: var(--ink);
}

.sb-cascade-row {
  display: grid;
  grid-template-columns: 1fr 90px;
  align-items: center;
  gap: 10px;
}

/* Reasoner config */
.sb-reasoner-grid { display: grid; gap: 10px; }
.sb-field-label {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 4px;
  display: block;
}
.sb-hidden { display: none !important; }
.sb-apikey-warning {
  font-family: var(--mono);
  font-size: 9.5px;
  line-height: 1.55;
  color: hsl(13 45% 38%);
  background: hsl(13 50% 50% / 0.06);
  border-left: 2px solid hsl(13 50% 50% / 0.5);
  padding: 6px 8px;
  margin-top: 4px;
}

/* =========================================================================
 *  Stage
 * ========================================================================= */
.sb-stage-pane {
  padding: 24px 28px 80px;
  min-width: 0;
  overflow-x: hidden;
}

/* Request form */
.sb-request-form {
  background: hsl(40 28% 91%);
  border: 1px solid hsl(40 20% 78%);
  padding: 18px 20px 14px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 14px 18px;
  margin-bottom: 24px;
}
.sb-req-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.sb-req-field--note { grid-column: 1 / span 3; }
.sb-req-field input, .sb-req-field select {
  font-family: var(--mono);
  font-size: 11.5px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 6px 8px;
  outline: none;
  color: var(--ink);
  width: 100%;
}
.sb-req-field input:focus, .sb-req-field select:focus { border-color: var(--ink-soft); }
.sb-req-field input::placeholder { color: var(--ink-mute); font-style: italic; }

.sb-fire-row {
  grid-column: 4;
  grid-row: 1 / span 3;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: center;
  gap: 6px;
}
.sb-fire-btn {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  background: var(--ink);
  color: var(--paper);
  border: 1px solid var(--ink);
  padding: 16px 12px;
  cursor: pointer;
  width: 100%;
  transition: background 150ms ease, color 150ms ease;
}
.sb-fire-btn:hover:not(:disabled) {
  background: var(--terracotta);
  border-color: var(--terracotta);
  color: var(--paper);
}
.sb-fire-btn:disabled {
  background: hsl(34 14% 70%);
  border-color: hsl(34 14% 70%);
  color: hsl(40 20% 45%);
  cursor: not-allowed;
}
.sb-fire-hint {
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--ink-mute);
  letter-spacing: 0.06em;
  text-align: center;
  min-height: 12px;
}

@media (max-width: 1280px) {
  .sb-request-form { grid-template-columns: 1fr 1fr; }
  .sb-fire-row { grid-column: auto; grid-row: auto; }
  .sb-req-field--note { grid-column: 1 / -1; }
}

/* Idle stage */
.sb-stage-idle {
  font-family: var(--display);
  font-style: italic;
  font-size: 22px;
  font-weight: 350;
  color: var(--ink-mute);
  text-align: center;
  padding: 96px 40px;
  border: 1px dashed var(--rule);
  background: hsl(40 28% 91% / 0.4);
}
.sb-stage-idle .small {
  display: block;
  margin-top: 14px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-style: normal;
  color: var(--ink-mute);
}

/* Narrative band (mirrors .s3-narrative-band) */
.sb-narrative-band {
  background: hsl(40 28% 91%);
  border: 1px solid hsl(40 20% 78%);
  border-bottom: none;
  padding: 20px 26px 18px;
}
.sb-nb-eyebrow {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: hsl(40 20% 52%);
  margin-bottom: 10px;
}
.sb-nb-text {
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  color: hsl(222 28% 18%);
  margin: 0;
  font-style: italic;
  transition: opacity 300ms ease;
}
.sb-nb-text--fading { opacity: 0; transition: opacity 200ms ease; }

/* Principal columns (mirrors index.html .stage / .party / .calendar) */
.sb-stage {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  background: hsl(220 22% 8%);
  border: 1px solid hsl(220 18% 22%);
  min-height: 460px;
  position: relative;
}
.sb-stage--3 { grid-template-columns: 1fr 1.6fr 1fr; }

.sb-party {
  padding: 22px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
  min-width: 0;
}
.sb-party + .sb-party { border-left: 1px solid hsl(220 18% 22%); }

.sb-party .who { display: flex; align-items: center; gap: 12px; }
.sb-party .who-name {
  font-family: var(--display);
  font-style: italic;
  font-size: 20px;
  font-weight: 400;
  color: var(--paper);
  line-height: 1.1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sb-party .who-id {
  font-family: var(--mono);
  font-size: 10px;
  color: hsl(40 25% 60%);
  letter-spacing: 0.04em;
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sb-panel-label {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: hsl(40 20% 55%);
  border-top: 1px solid hsl(220 18% 22%);
  padding-top: 12px;
  margin-top: 4px;
}

.sb-calendar {
  font-family: var(--mono);
  font-size: 11px;
  background: hsl(220 22% 6%);
  border: 1px solid hsl(220 18% 18%);
}
.sb-cal-event {
  padding: 9px 12px;
  border-bottom: 1px solid hsl(220 18% 16%);
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 8px;
  align-items: baseline;
  transition: background 250ms ease;
  position: relative;
}
.sb-cal-event:last-child { border-bottom: none; }
.sb-cal-event .time {
  color: hsl(40 25% 70%);
  letter-spacing: 0.04em;
}
.sb-cal-event .title {
  color: var(--paper);
  font-family: var(--body);
  font-style: italic;
  font-size: 13px;
}
.sb-cal-event .attendees {
  grid-column: 2;
  color: hsl(40 20% 55%);
  font-size: 10px;
  margin-top: 2px;
}
.sb-cal-event.blocking {
  border-left: 3px solid var(--terracotta);
  background: hsl(13 25% 11%);
}
.sb-cal-event.blocking .time  { color: var(--terracotta); }
.sb-cal-event.blocking .title { color: hsl(13 50% 75%); }
.sb-cal-event.booked {
  background: hsl(220 22% 12%);
  border-left: 3px solid var(--gold);
}
.sb-cal-event.booked .time  { color: var(--gold); }
.sb-cal-event.booked .title { color: var(--paper); font-style: normal; font-weight: 500; }
.sb-cal-event.booked .attendees { color: hsl(40 50% 65%); letter-spacing: 0.04em; }
.sb-cal-event.booked::after {
  content: "✓ SIGNED";
  position: absolute;
  right: 12px;
  top: 9px;
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0.18em;
  color: var(--gold);
}
.sb-cal-empty {
  padding: 14px;
  font-family: var(--mono);
  font-size: 10px;
  font-style: italic;
  color: hsl(40 20% 45%);
  text-align: center;
}
.sb-slot-moving-out {
  transition: opacity 400ms ease, background 400ms ease;
  opacity: 0.15;
  background: hsl(13 30% 16%);
}
.sb-slot-moving-out .title { text-decoration: line-through; }
.sb-slot-moving-out .time  { color: hsl(13 40% 45%); }
.sb-slot-appearing { opacity: 0; transition: opacity 500ms ease; }
.sb-slot-appeared  { opacity: 1; border-left: 3px solid var(--jade); }

/* Avatar slot tints inside stage */
.sb-stage-avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-style: italic; font-size: 20px; flex-shrink: 0; }
.sb-stage-avatar--slot-0 { background: var(--slot-0-bg); color: var(--ink); }
.sb-stage-avatar--slot-1 { background: var(--slot-1-bg); color: var(--paper); }
.sb-stage-avatar--slot-2 { background: var(--slot-2-bg); color: var(--paper); }
.sb-stage-avatar--slot-3 { background: var(--slot-3-bg); color: var(--paper); }
.sb-stage-avatar--slot-4 { background: var(--slot-4-bg); color: var(--paper); }
.sb-stage-avatar--slot-5 { background: var(--slot-5-bg); color: var(--paper); }

/* Scoped payload panel */
.sb-payload-panel {
  font-family: var(--mono);
  font-size: 11px;
  color: hsl(40 25% 65%);
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 6px 0;
}
.sb-pp-row { display: flex; gap: 12px; justify-content: space-between; }
.sb-pp-k { color: hsl(40 20% 55%); }
.sb-pp-v { color: hsl(40 35% 70%); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
.sb-pp-blocked .sb-pp-k, .sb-pp-blocked .sb-pp-v { color: hsl(13 40% 50%); }
.sb-pp-pending { color: hsl(40 15% 45%); font-style: italic; }
.sb-pp-hash { font-size: 9.5px; color: hsl(40 15% 45%); margin-top: 4px; letter-spacing: 0.04em; }

/* Reasoning trace */
.sb-reasoning-trace {
  border: 1px solid hsl(40 25% 28% / 0.6);
  background: hsl(222 28% 9%);
  padding: 14px 16px;
  font-family: var(--mono);
  font-size: 11px;
  visibility: hidden;
  opacity: 0;
  transition: opacity 400ms ease, visibility 0s linear 400ms;
  position: relative;
}
.sb-reasoning-trace::before {
  content: "REASONING TRACE";
  position: absolute;
  top: -8px; left: 14px;
  background: hsl(222 28% 9%);
  padding: 0 8px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.24em;
  color: hsl(40 25% 55%);
}
.sb-reasoning-trace--visible { visibility: visible; opacity: 1; transition: opacity 400ms ease; }

.sb-trace-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.sb-trace-eyebrow {
  font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase; color: hsl(40 25% 55%);
}
.sb-trace-spinner {
  display: inline-block; width: 11px; height: 11px;
  border: 1.5px solid hsl(40 70% 53% / 0.3); border-top-color: var(--gold);
  border-radius: 50%; opacity: 0;
}
.sb-trace-spinner--active { opacity: 1; animation: sbSpin 800ms linear infinite; }
@keyframes sbSpin { to { transform: rotate(360deg); } }

.sb-trace-field {
  display: flex; gap: 10px; margin: 3px 0;
  opacity: 0; transform: translateY(4px);
  transition: opacity 300ms ease, transform 300ms ease;
}
.sb-trace-field--visible { opacity: 1; transform: translateY(0); }
.sb-tf-key { color: hsl(40 20% 55%); width: 170px; flex-shrink: 0; font-size: 10.5px; }
.sb-tf-val { color: hsl(40 60% 78%); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sb-trace-reason-label {
  font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: hsl(40 20% 50%);
  margin-top: 10px;
  margin-bottom: 6px;
  border-top: 1px solid hsl(220 18% 22%);
  padding-top: 8px;
}
.sb-trace-reason {
  font-family: var(--mono); font-size: 10.5px; line-height: 1.65;
  color: hsl(40 30% 72%);
  white-space: pre-wrap; word-break: break-word;
  margin: 0;
}

/* Arrows */
.sb-arrows-layer {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 2; overflow: visible;
}
.sb-arrow {
  stroke: var(--gold); stroke-width: 1.5; fill: none;
  stroke-linecap: round;
  stroke-dasharray: 200; stroke-dashoffset: 200;
  opacity: 0;
  transition: stroke-dashoffset 500ms cubic-bezier(0.4, 0, 0.2, 1), opacity 200ms ease;
}
.sb-arrow--active { stroke-dashoffset: 0; opacity: 0.85; }

/* Exchange badges */
.sb-exchange-badges { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
.sb-exchange-badge {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1px solid hsl(220 18% 24%);
  background: hsl(220 22% 9%);
  padding: 10px 12px;
  opacity: 0; transform: translateY(8px) scale(0.96);
}
.sb-exchange-badge--entering { animation: sbBadgeEnter 600ms cubic-bezier(0.34, 1.4, 0.6, 1) forwards; }
@keyframes sbBadgeEnter { to { opacity: 1; transform: translateY(0) scale(1); } }
.sb-badge-svg { width: 48px; height: 66px; flex-shrink: 0; }
.sb-badge-meta { font-family: var(--mono); font-size: 10px; line-height: 1.6; display: flex; flex-direction: column; gap: 2px; }
.sb-badge-label { color: var(--gold); letter-spacing: 0.14em; text-transform: uppercase; font-size: 10px; font-weight: 500; }
.sb-badge-principals { color: hsl(40 25% 65%); }
.sb-badge-hash { color: hsl(40 15% 55%); font-size: 9.5px; }
.sb-badge-hash .hash-val { color: hsl(40 30% 65%); }
.sb-badge-taskid { color: hsl(155 30% 55%); font-size: 9px; letter-spacing: 0.1em; margin-top: 4px; }
.sb-badge-svg .sb-badge-seam {
  stroke: var(--gold); stroke-width: 1.5;
  stroke-dasharray: 60; stroke-dashoffset: 60;
  filter: drop-shadow(0 0 4px hsl(40 70% 55% / 0.5));
}
.sb-badge-svg--seam-active .sb-badge-seam {
  transition: stroke-dashoffset 700ms ease 400ms;
  stroke-dashoffset: 0;
}

/* Dialogue panel */
.sb-dialogue-panel {
  background: hsl(220 22% 7%);
  border: 1px solid hsl(220 18% 22%);
  border-top: none;
}
.sb-dp-header {
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding: 14px 20px 12px;
  border-bottom: 1px solid hsl(220 18% 18%);
}
.sb-dp-eyebrow {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: hsl(40 25% 55%);
}
.sb-dp-hint { font-family: var(--mono); font-size: 10px; color: hsl(40 15% 40%); }
.sb-dp-body { display: flex; flex-direction: column; gap: 0; padding: 6px 0; min-height: 40px; }

.sb-dm {
  display: flex; gap: 0;
  padding: 10px 20px;
  border-bottom: 1px solid hsl(220 18% 13%);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 350ms ease, transform 350ms ease;
}
.sb-dm:last-child { border-bottom: none; }
.sb-dm--visible { opacity: 1; transform: translateY(0); }

.sb-dm-meta {
  font-family: var(--mono);
  font-size: 10px;
  color: hsl(40 15% 45%);
  letter-spacing: 0.06em;
  width: 150px;
  flex-shrink: 0;
  padding-top: 2px;
  line-height: 1.45;
}
.sb-dm-time { display: block; color: hsl(40 20% 38%); }
.sb-dm-from { display: block; font-weight: 500; color: hsl(40 20% 55%); }
.sb-dm-bubble {
  flex: 1;
  font-family: var(--body);
  font-size: 13.5px;
  line-height: 1.5;
  color: hsl(40 20% 78%);
  padding-left: 16px;
  border-left: 3px solid transparent;
  font-style: italic;
}
.sb-dm-direction {
  font-family: var(--mono);
  font-size: 9.5px;
  font-style: normal;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 5px;
  display: block;
  color: hsl(40 15% 45%);
}
.sb-dm-spinner {
  display: inline-block;
  width: 10px; height: 10px;
  border: 1.5px solid hsl(40 30% 35% / 0.4);
  border-top-color: hsl(40 50% 52%);
  border-radius: 50%;
  vertical-align: middle;
  margin-left: 8px;
  animation: sbSpin 800ms linear infinite;
}
.sb-dm--thinking .sb-dm-bubble { color: hsl(40 15% 50%); font-style: italic; }
.sb-dm--thinking .sb-dm-direction { color: hsl(40 12% 40%); }

.sb-dm--slot-0 .sb-dm-bubble { border-left-color: hsl(40 55% 68%); }
.sb-dm--slot-0 .sb-dm-direction { color: hsl(40 45% 60%); }
.sb-dm--slot-1 .sb-dm-bubble { border-left-color: var(--jade); }
.sb-dm--slot-1 .sb-dm-direction { color: hsl(155 30% 52%); }
.sb-dm--slot-2 .sb-dm-bubble { border-left-color: var(--terracotta); }
.sb-dm--slot-2 .sb-dm-direction { color: hsl(13 45% 58%); }
.sb-dm--slot-3 .sb-dm-bubble { border-left-color: hsl(240 25% 62%); }
.sb-dm--slot-3 .sb-dm-direction { color: hsl(240 20% 65%); }
.sb-dm--slot-4 .sb-dm-bubble { border-left-color: hsl(30 55% 62%); }
.sb-dm--slot-4 .sb-dm-direction { color: hsl(30 45% 58%); }
.sb-dm--slot-5 .sb-dm-bubble { border-left-color: hsl(270 20% 55%); }
.sb-dm--slot-5 .sb-dm-direction { color: hsl(270 18% 60%); }

/* Tessera-fit overlay */
.sb-fit-overlay {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, hsl(220 22% 6% / 0.92) 0%, hsl(220 22% 6% / 0.7) 100%);
  z-index: 10;
  pointer-events: none;
}
.sb-fit-overlay.active { display: flex; animation: sbFade 400ms ease forwards; }
@keyframes sbFade { from { opacity: 0; } to { opacity: 1; } }
.sb-fit-glyph { position: relative; width: 260px; height: 260px; }
.sb-fit-verdict {
  position: absolute;
  bottom: 16%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gold);
  opacity: 0;
  animation: sbFadeLate 800ms ease 700ms forwards;
}
@keyframes sbFadeLate { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.sb-fit-half-l, .sb-fit-half-r {
  position: absolute; top: 0; width: 50%; height: 100%;
}
.sb-fit-half-l { left: 0;  animation: sbSlideL 900ms cubic-bezier(0.34, 1.4, 0.6, 1) forwards; }
.sb-fit-half-r { right: 0; animation: sbSlideR 900ms cubic-bezier(0.34, 1.4, 0.6, 1) forwards; }
@keyframes sbSlideL { from { transform: translateX(-60%) rotate(-3deg); opacity: 0; } to { transform: translateX(0) rotate(0); opacity: 1; } }
@keyframes sbSlideR { from { transform: translateX(60%) rotate(3deg); opacity: 0; }  to { transform: translateX(0) rotate(0); opacity: 1; } }
.sb-fit-seam {
  position: absolute;
  left: 50%;
  top: 12%; bottom: 12%;
  width: 2px;
  background: linear-gradient(to bottom, transparent, var(--gold), var(--gold), transparent);
  transform: translateX(-50%) scaleY(0);
  transform-origin: center;
  animation: sbSeam 700ms ease 800ms forwards;
  box-shadow: 0 0 24px hsl(40 70% 55% / 0.6);
}
@keyframes sbSeam { from { transform: translateX(-50%) scaleY(0); } to { transform: translateX(-50%) scaleY(1); } }

/* Step indicator */
.sb-step-indicator {
  display: flex;
  gap: 0;
  margin-top: 22px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: hsl(40 25% 55%);
}
.sb-step {
  flex: 1;
  padding: 12px 14px;
  border: 1px solid hsl(220 18% 22%);
  border-right: none;
  background: hsl(220 22% 8%);
  transition: all 300ms ease;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sb-step:last-child { border-right: 1px solid hsl(220 18% 22%); }
.sb-step .n {
  font-family: var(--display);
  font-size: 17px;
  font-style: italic;
  letter-spacing: -0.02em;
  text-transform: none;
  color: hsl(40 20% 45%);
}
.sb-step.active { background: hsl(220 22% 13%); color: var(--gold); }
.sb-step.active .n { color: var(--gold); }
.sb-step.done .n { color: var(--jade); }
.sb-step.done    { color: hsl(155 25% 65%); }

/* Status bar */
.sb-status-bar {
  margin-top: 14px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: hsl(40 25% 38%);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* Abort banner */
.sb-abort-banner {
  border: 1px solid var(--terracotta-deep);
  background: hsl(13 40% 10%);
  color: hsl(13 50% 70%);
  font-family: var(--mono); font-size: 12px;
  padding: 18px 22px; margin-top: 22px;
  position: relative;
  display: none;
}
.sb-abort-banner.sb-abort-visible { display: block; }
.sb-abort-banner::before {
  content: "RUN ABORTED";
  display: block; font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--terracotta); margin-bottom: 10px;
}
.sb-abort-reason { line-height: 1.6; color: hsl(13 45% 65%); }
.sb-abort-reset {
  display: inline-block;
  margin-top: 10px;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--terracotta);
  cursor: pointer;
  background: transparent;
  border: 1px solid var(--terracotta-deep);
  padding: 5px 10px;
}

/* Ledger blocks (paper, mirrors index.html) */
.sb-ledger-block {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-top: 28px;
}
.sb-ledger-block--3 { grid-template-columns: 1fr 1.4fr 1fr; }
.sb-ledger-block > .sb-ledger { min-width: 0; }
.sb-ledger {
  background: var(--paper);
  color: var(--ink);
  padding: 28px 26px 22px;
  border: 1px solid var(--ink-soft);
  position: relative;
  font-family: var(--mono);
  font-size: 11.5px;
  box-shadow:
    0 1px 0 hsl(34 20% 50% / 0.2),
    inset 0 0 0 1px hsl(40 30% 88%);
}
.sb-ledger::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 0; bottom: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0 28px,
    hsl(34 25% 72% / 0.18) 28px 29px
  );
  pointer-events: none;
}
.sb-ledger > * { position: relative; z-index: 1; }

.sb-ledger-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
  margin-bottom: 12px;
}
.sb-ledger-who {
  font-family: var(--display);
  font-style: italic;
  font-size: 18px;
  font-weight: 500;
}
.sb-ledger-label {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

.sb-ledger-entry {
  padding: 14px 0;
  border-bottom: 1px solid hsl(34 18% 76%);
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 10px;
  min-width: 0;
}
.sb-ledger-entry:last-child { border-bottom: none; }
.sb-ledger-entry .seq {
  font-family: var(--display);
  font-style: italic;
  font-size: 20px;
  line-height: 1;
  color: var(--ink-soft);
  padding-top: 4px;
}
.sb-ledger-entry .body { font-size: 11px; line-height: 1.6; min-width: 0; overflow: hidden; }
.sb-ledger-entry .body .row { display: block; }
.sb-ledger-entry .body .k { color: var(--ink-mute); display: inline-block; width: 100px; }
.sb-ledger-entry .body .v { color: var(--ink); }
.sb-ledger-entry .body .v.emit    { color: var(--terracotta-deep); font-weight: 500; }
.sb-ledger-entry .body .v.receive { color: var(--jade-deep);       font-weight: 500; }
.sb-ledger-entry .body .hash {
  color: var(--ink-mute);
  font-size: 10px;
  display: block;
  margin-left: 100px;
  margin-top: -1.55em;
  word-break: break-all;
}
.sb-ledger-empty {
  font-family: var(--display);
  font-style: italic;
  color: var(--ink-mute);
  padding: 24px 0;
  text-align: center;
  font-size: 14px;
}

/* Responsive */
@media (max-width: 1100px) {
  .sb-workspace { grid-template-columns: 1fr; }
  .sb-editor {
    border-right: none;
    border-bottom: 1px solid var(--rule);
    position: relative;
    max-height: none;
  }
  .sb-header { grid-template-columns: 1fr; gap: 8px; padding: 14px 18px; }
  .sb-header-eyebrow { justify-self: start; }
  .sb-header-nav { justify-self: start; flex-wrap: wrap; }
  .sb-stage, .sb-stage--3 { grid-template-columns: 1fr; }
  .sb-party + .sb-party { border-left: none; border-top: 1px solid hsl(220 18% 22%); }
  .sb-ledger-block, .sb-ledger-block--3 { grid-template-columns: 1fr; }
  .sb-ledger-entry .body .hash { margin-left: 0; margin-top: 2px; }
  .sb-stage-pane { padding: 18px 16px 60px; }
}

</style>
</head>
<body>

<header class="sb-header">
  <div class="sb-header-brand">⌘ MESHYCAL  ·  SANDBOX</div>
  <div class="sb-header-eyebrow">R&amp;D mode · session-scoped principals · API keys live in memory only</div>
  <nav class="sb-header-nav">
    <a href="index.html" class="sb-back-link">← demo</a>
    <div id="sb-session-badge" class="sb-session-badge">checking…</div>
    <button type="button" id="sb-reset-btn" class="sb-reset-btn">reset session</button>
  </nav>
</header>

<div class="sb-workspace">

  <aside class="sb-editor">
    <div class="sb-editor-eyebrow">
      <span>principals · this session</span>
      <span class="count" id="sb-editor-count">—</span>
    </div>
    <div class="sb-editor-list" id="sb-editor-list"></div>
    <button type="button" class="sb-add-principal-btn" id="sb-add-principal-btn">+ add principal</button>
  </aside>

  <main class="sb-stage-pane">

    <form class="sb-request-form" id="sb-request-form" onsubmit="return false;">
      <div class="sb-req-field">
        <label class="sb-field-label" for="sb-req-sender">From</label>
        <select id="sb-req-sender"></select>
      </div>
      <div class="sb-req-field">
        <label class="sb-field-label" for="sb-req-recipient">To</label>
        <select id="sb-req-recipient"></select>
      </div>
      <div class="sb-req-field">
        <label class="sb-field-label" for="sb-req-duration">Duration (min)</label>
        <input type="number" id="sb-req-duration" min="5" max="480" step="5" value="30" />
      </div>
      <div class="sb-fire-row">
        <button type="button" id="sb-fire-btn" class="sb-fire-btn">Fire request</button>
        <div id="sb-fire-hint" class="sb-fire-hint"></div>
      </div>

      <div class="sb-req-field">
        <label class="sb-field-label" for="sb-req-earliest">Earliest start</label>
        <input type="datetime-local" id="sb-req-earliest" />
      </div>
      <div class="sb-req-field">
        <label class="sb-field-label" for="sb-req-latest">Latest end</label>
        <input type="datetime-local" id="sb-req-latest" />
      </div>

      <div class="sb-req-field sb-req-field--note">
        <label class="sb-field-label" for="sb-req-note">Context note (optional)</label>
        <input type="text" id="sb-req-note" placeholder="what is this meeting about?" />
      </div>
    </form>

    <div id="sb-stage-root">
      <div id="sb-stage-idle" class="sb-stage-idle">
        fire a request to begin
        <span class="small">the run will appear here</span>
      </div>
    </div>

    <div class="sb-step-indicator sb-hidden" id="sb-step-indicator"></div>
    <div class="sb-status-bar sb-hidden" id="sb-status-bar">ready</div>

    <div class="sb-abort-banner" id="sb-abort-banner">
      <div class="sb-abort-reason" id="sb-abort-reason"></div>
      <button type="button" class="sb-abort-reset" id="sb-abort-reset">reset stage</button>
    </div>

  </main>

</div>

<script>
(function () {
  "use strict";

  /* ===================================================================
   *  Constants
   * =================================================================== */
  const SB_API_BASE = (window.MESHYCAL_API_BASE || "http://127.0.0.1:8765").replace(/\/$/, "");
  const SB_SANDBOX_API_BASE = (window.MESHYCAL_SANDBOX_API_BASE || SB_API_BASE).replace(/\/$/, "");

  const MAX_PRINCIPALS = 6;
  const MAX_EVENTS = 10;

  const DEFAULT_OUTBOUND_ALLOW = ["candidates", "duration_minutes", "constraint_hints"];
  const DEFAULT_OUTBOUND_BLOCK = ["calendar_titles", "attendee_emails"];
  const DEFAULT_INBOUND_ALLOW  = ["candidates", "duration_minutes", "constraint_hints"];

  /* -----------------------------------------------------------------
   *  Calendar archetypes — realistic professional-world templates
   *  Each event: { time, duration, title, attendees, isBlocking }
   *  Times stay between 09:00 and 17:30 (working hours).
   * ----------------------------------------------------------------- */
  const ARCHETYPES = {
    manager: {
      label: "Manager — back to back",
      events: [
        { time: "09:00", duration: 30, title: "team-standup",    attendees: "team",     isBlocking: false },
        { time: "09:45", duration: 30, title: "1-on-1",          attendees: "report-a", isBlocking: false },
        { time: "10:30", duration: 60, title: "product-review",  attendees: "product",  isBlocking: false },
        { time: "12:00", duration: 45, title: "lunch",           attendees: "solo",     isBlocking: false },
        { time: "13:30", duration: 45, title: "design-crit",     attendees: "design",   isBlocking: false },
        { time: "14:30", duration: 30, title: "1-on-1",          attendees: "report-b", isBlocking: true  },
        { time: "15:30", duration: 45, title: "customer-call",   attendees: "customer", isBlocking: false },
        { time: "16:30", duration: 30, title: "weekly-planning", attendees: "team",     isBlocking: false }
      ]
    },
    engineer: {
      label: "Engineer — focus blocks",
      events: [
        { time: "09:30", duration: 15,  title: "standup",     attendees: "team", isBlocking: false },
        { time: "10:00", duration: 120, title: "focus-block", attendees: "solo", isBlocking: false },
        { time: "12:15", duration: 30,  title: "lunch",       attendees: "solo", isBlocking: false },
        { time: "13:00", duration: 30,  title: "code-review", attendees: "peer", isBlocking: true  },
        { time: "14:00", duration: 120, title: "deep-work",   attendees: "solo", isBlocking: false },
        { time: "16:30", duration: 30,  title: "pr-sync",     attendees: "peer", isBlocking: false }
      ]
    },
    founder: {
      label: "Founder — varied",
      events: [
        { time: "09:00", duration: 45, title: "investor-call",       attendees: "investor",  isBlocking: false },
        { time: "10:00", duration: 45, title: "board-prep",          attendees: "solo",      isBlocking: false },
        { time: "11:00", duration: 30, title: "product-review",      attendees: "team",      isBlocking: false },
        { time: "13:00", duration: 45, title: "advisor-1on1",        attendees: "advisor",   isBlocking: false },
        { time: "14:00", duration: 30, title: "customer-interview",  attendees: "customer",  isBlocking: true  },
        { time: "15:00", duration: 60, title: "team-town-hall",      attendees: "team",      isBlocking: false },
        { time: "16:30", duration: 45, title: "candidate-interview", attendees: "candidate", isBlocking: false }
      ]
    },
    designer: {
      label: "Designer — reviews & deep work",
      events: [
        { time: "09:30", duration: 60,  title: "design-critique",  attendees: "design", isBlocking: false },
        { time: "11:00", duration: 90,  title: "concept-explore",  attendees: "solo",   isBlocking: false },
        { time: "13:00", duration: 30,  title: "stakeholder-sync", attendees: "pm",     isBlocking: true  },
        { time: "14:00", duration: 120, title: "production-work",  attendees: "solo",   isBlocking: false },
        { time: "16:30", duration: 30,  title: "design-1on1",      attendees: "report", isBlocking: false }
      ]
    },
    openDay: {
      label: "Open day — light",
      events: [
        { time: "10:00", duration: 30, title: "standup",    attendees: "team", isBlocking: false },
        { time: "14:00", duration: 30, title: "quick-sync", attendees: "peer", isBlocking: false }
      ]
    },
    empty: {
      label: "Empty — clear schedule",
      events: []
    },
    randomize: {
      label: "Randomize a typical day",
      generator: true
    }
  };

  function generateRandomDay() {
    const titles = [
      "standup", "1-on-1", "design-review", "planning", "demo",
      "customer-call", "interview", "product-review",
      "weekly-review", "focus-block", "lunch", "code-review",
      "stakeholder-sync", "advisor-1on1", "pr-sync"
    ];
    const attendees = ["team", "peer", "report", "customer", "pm", "design", "investor", "solo", "advisor"];
    const durations = [30, 30, 45, 45, 60];
    const events = [];
    let hour = 9;
    let placedBlocker = false;
    while (hour < 17) {
      if (events.length >= 8) break;
      const dur = durations[Math.floor(Math.random() * durations.length)];
      const title = titles[Math.floor(Math.random() * titles.length)];
      const att = attendees[Math.floor(Math.random() * attendees.length)];
      const isBlocking = !placedBlocker && Math.random() < 0.45;
      if (isBlocking) placedBlocker = true;
      const minute = Math.random() < 0.55 ? "00" : "30";
      events.push({
        time: pad2(hour) + ":" + minute,
        duration: dur,
        title: title,
        attendees: att,
        isBlocking: isBlocking
      });
      const advance = 1 + Math.floor(Math.random() * 2);
      hour += advance;
    }
    if (!placedBlocker && events.length > 0) {
      const idx = Math.floor(events.length / 2);
      events[idx].isBlocking = true;
    }
    return events;
  }

  function applyArchetype(p, key) {
    const arch = ARCHETYPES[key];
    if (!arch) return;
    if (arch.generator) {
      p.calendar = generateRandomDay();
    } else {
      p.calendar = arch.events.map(e => Object.assign({}, e));
    }
    persistSession();
    rerenderCard(p);
  }

  /* -----------------------------------------------------------------
   *  Privacy / policy toggles — plain-English mapping
   * ----------------------------------------------------------------- */
  const POLICY_TOGGLES = [
    {
      field: "candidates",
      label: "Share which time slots are free",
      desc: "the specific times the agent proposes — e.g. \"tue 13:00, wed 10:00\""
    },
    {
      field: "duration_minutes",
      label: "Share how long the meeting should be",
      desc: "just the length — e.g. \"30 minutes\""
    },
    {
      field: "constraint_hints",
      label: "Share the timezone and similar hints",
      desc: "context for matching · timezone, working hours, etc."
    },
    {
      field: "calendar_titles",
      label: "Share titles of meetings already on the calendar",
      desc: "things like \"weekly-review\" or \"customer-call\" · off keeps your day private"
    },
    {
      field: "attendee_emails",
      label: "Share who else is in your existing meetings",
      desc: "names / emails of people in your other meetings · off keeps your network private"
    }
  ];

  function isFieldShared(p, field) {
    return p.policy.outboundAllow.includes(field);
  }

  function setFieldShared(p, field, on) {
    if (on) {
      if (!p.policy.outboundAllow.includes(field)) p.policy.outboundAllow.push(field);
      p.policy.outboundBlock = p.policy.outboundBlock.filter(f => f !== field);
      if (!p.policy.inboundAllow.includes(field))  p.policy.inboundAllow.push(field);
    } else {
      p.policy.outboundAllow = p.policy.outboundAllow.filter(f => f !== field);
      if (!p.policy.outboundBlock.includes(field)) p.policy.outboundBlock.push(field);
      p.policy.inboundAllow  = p.policy.inboundAllow.filter(f => f !== field);
    }
    persistSession();
  }

  /* ===================================================================
   *  State
   * =================================================================== */
  const SB_STATE = {
    sessionToken: null,
    backendOk: false,
    principals: [],
    runInProgress: false,
    apiKeys: {},
    openCards: new Set()
  };

  /* ===================================================================
   *  DOM helpers
   * =================================================================== */
  function $(id) { return document.getElementById(id); }
  function clearChildren(el) { while (el && el.firstChild) el.removeChild(el.firstChild); }
  function elem(tag, opts, ...children) {
    opts = opts || {};
    const e = document.createElement(tag);
    if (opts.className) e.className = opts.className;
    if (opts.text != null) e.textContent = opts.text;
    if (opts.attrs) for (const k in opts.attrs) e.setAttribute(k, opts.attrs[k]);
    if (opts.style) for (const k in opts.style) e.style[k] = opts.style[k];
    for (const c of children) if (c != null) e.appendChild(c);
    return e;
  }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function fakeHash(seed) {
    const chars = "0123456789abcdef";
    let h = "";
    let s = seed;
    for (let i = 0; i < 64; i++) {
      s = (s * 31 + 17) % 4093;
      h += chars[s % 16];
    }
    return h;
  }

  function slugify(s) {
    return String(s || "")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-|-$/g, "")
      .slice(0, 24) || "principal";
  }

  function initialsOf(name) {
    const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "·";
    if (parts.length === 1) return parts[0].slice(0, 1).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function principalById(id) {
    return SB_STATE.principals.find(p => p.id === id) || null;
  }
  function principalColorSlot(id) {
    const p = principalById(id);
    return p ? p.colorSlot : 0;
  }
  function principalShortName(id) {
    const p = principalById(id);
    return p ? p.displayName : id;
  }

  /* ===================================================================
   *  Default seed
   * =================================================================== */
  function seedDefaultPrincipals() {
    return [
      {
        id: "iris@sandbox.local",
        displayName: "Iris",
        colorSlot: 0,
        calendar: [
          { time: "09:00", duration: 60, title: "morning-standup", attendees: "team", isBlocking: false },
          { time: "11:00", duration: 30, title: "focus-block",     attendees: "solo", isBlocking: false }
        ],
        policy: {
          outboundAllow: DEFAULT_OUTBOUND_ALLOW.slice(),
          outboundBlock: DEFAULT_OUTBOUND_BLOCK.slice(),
          inboundAllow:  DEFAULT_INBOUND_ALLOW.slice(),
          maxCascadeDepth: 1
        },
        reasoner: { provider: "scripted", model: "", baseUrl: "" }
      },
      {
        id: "marius@sandbox.local",
        displayName: "Marius",
        colorSlot: 1,
        calendar: [
          { time: "10:00", duration: 60, title: "weekly-review", attendees: "team",  isBlocking: false },
          { time: "14:00", duration: 45, title: "project-sync",  attendees: "atlas", isBlocking: true  },
          { time: "15:30", duration: 30, title: "1-on-1",        attendees: "report", isBlocking: false }
        ],
        policy: {
          outboundAllow: DEFAULT_OUTBOUND_ALLOW.slice(),
          outboundBlock: DEFAULT_OUTBOUND_BLOCK.slice(),
          inboundAllow:  DEFAULT_INBOUND_ALLOW.slice(),
          maxCascadeDepth: 1
        },
        reasoner: { provider: "scripted", model: "", baseUrl: "" }
      },
      {
        id: "atlas@sandbox.local",
        displayName: "Atlas",
        colorSlot: 2,
        calendar: [
          { time: "14:00", duration: 45, title: "project-sync", attendees: "marius", isBlocking: true }
        ],
        policy: {
          outboundAllow: DEFAULT_OUTBOUND_ALLOW.slice(),
          outboundBlock: DEFAULT_OUTBOUND_BLOCK.slice(),
          inboundAllow:  DEFAULT_INBOUND_ALLOW.slice(),
          maxCascadeDepth: 1
        },
        reasoner: { provider: "scripted", model: "", baseUrl: "" }
      }
    ];
  }

  function nextColorSlot() {
    const used = SB_STATE.principals.map(p => p.colorSlot);
    for (let i = 0; i < 6; i++) if (!used.includes(i)) return i;
    return SB_STATE.principals.length % 6;
  }

  function nextPrincipalId() {
    const taken = new Set(SB_STATE.principals.map(p => p.id));
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    for (let i = SB_STATE.principals.length; i < 26; i++) {
      const letter = letters[i] || ("p" + i);
      const id = "principal-" + letter.toLowerCase() + "@sandbox.local";
      if (!taken.has(id)) return { id, displayName: "Principal " + letter };
    }
    return { id: "principal-x@sandbox.local", displayName: "Principal X" };
  }

  /* ===================================================================
   *  Persistence
   * =================================================================== */
  const LS_KEY_PRINCIPALS = "sb_principals";

  function persistSession() {
    try {
      const sanitized = SB_STATE.principals.map(p => ({
        id: p.id,
        displayName: p.displayName,
        colorSlot: p.colorSlot,
        calendar: p.calendar,
        policy: p.policy,
        reasoner: { provider: p.reasoner.provider, model: p.reasoner.model, baseUrl: p.reasoner.baseUrl }
      }));
      localStorage.setItem(LS_KEY_PRINCIPALS, JSON.stringify(sanitized));
    } catch (_) {}
  }

  function hydrateSession() {
    try {
      const raw = localStorage.getItem(LS_KEY_PRINCIPALS);
      if (!raw) return false;
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed) || parsed.length === 0) return false;
      SB_STATE.principals = parsed.map(p => ({
        id: p.id,
        displayName: p.displayName,
        colorSlot: p.colorSlot || 0,
        calendar: Array.isArray(p.calendar) ? p.calendar : [],
        policy: p.policy || { outboundAllow: [], outboundBlock: [], inboundAllow: [], maxCascadeDepth: 1 },
        reasoner: p.reasoner || { provider: "scripted", model: "", baseUrl: "" }
      }));
      return true;
    } catch (_) {
      return false;
    }
  }

  /* ===================================================================
   *  Backend probe
   * =================================================================== */
  async function probeBackend() {
    const badge = $("sb-session-badge");
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 1500);
      const res = await fetch(SB_API_BASE + "/healthz", { signal: ctrl.signal });
      clearTimeout(t);
      if (!res.ok) throw new Error("not-ok");
      SB_STATE.backendOk = true;
      badge.textContent = "● backend live · animation mode (no sandbox endpoints yet)";
      badge.style.color = "hsl(155 30% 32%)";
      badge.style.borderColor = "hsl(155 30% 50%)";
    } catch (_) {
      SB_STATE.backendOk = false;
      badge.textContent = "○ backend offline · animation mode";
      badge.style.color = "hsl(13 50% 38%)";
      badge.style.borderColor = "hsl(13 50% 55%)";
    }
  }

  /* ===================================================================
   *  Editor — render principals
   * =================================================================== */
  function renderEditor() {
    const list = $("sb-editor-list");
    clearChildren(list);
    SB_STATE.principals.forEach(p => list.appendChild(renderPrincipalCard(p)));
    $("sb-editor-count").textContent = SB_STATE.principals.length + " of " + MAX_PRINCIPALS;
    $("sb-add-principal-btn").disabled = SB_STATE.principals.length >= MAX_PRINCIPALS;
    renderRequestSelects();
  }

  function renderPrincipalCard(p) {
    const card = elem("div", {
      className: "sb-card" + (SB_STATE.openCards.has(p.id) ? " sb-card--open" : ""),
      attrs: { "data-pid": p.id }
    });

    // Head
    const head = elem("div", { className: "sb-card-head" });
    const avatar = elem("div", { className: "sb-avatar sb-avatar--slot-" + p.colorSlot, text: initialsOf(p.displayName) });
    head.appendChild(avatar);

    const idBlock = elem("div", { className: "sb-card-id" });
    idBlock.appendChild(elem("div", { className: "sb-card-name", text: p.displayName }));
    idBlock.appendChild(elem("div", { className: "sb-card-sub", text: p.id }));
    head.appendChild(idBlock);

    const meta = elem("div", { className: "sb-card-meta" });
    meta.appendChild(reasonerBadge(p));
    meta.appendChild(elem("div", { className: "sb-card-event-count", text: p.calendar.length + " evt" }));
    head.appendChild(meta);

    head.addEventListener("click", () => toggleCard(p.id));
    card.appendChild(head);

    // Body
    const body = elem("div", { className: "sb-card-body" });
    body.appendChild(renderIdentitySection(p));
    body.appendChild(renderCalendarSection(p));
    body.appendChild(renderPolicySection(p));
    body.appendChild(renderReasonerSection(p));
    card.appendChild(body);

    return card;
  }

  function reasonerBadge(p) {
    const cls = "sb-reasoner-badge sb-reasoner-badge--" + (p.reasoner.provider === "openai-compatible" ? "compatible" : p.reasoner.provider);
    const label = p.reasoner.provider === "openai-compatible" ? "compatible" : p.reasoner.provider;
    return elem("div", { className: cls, text: label });
  }

  function toggleCard(pid) {
    if (SB_STATE.openCards.has(pid)) SB_STATE.openCards.delete(pid);
    else SB_STATE.openCards.add(pid);
    const card = document.querySelector('[data-pid="' + cssEscape(pid) + '"]');
    if (card) card.classList.toggle("sb-card--open");
  }

  function cssEscape(s) {
    if (window.CSS && CSS.escape) return CSS.escape(s);
    return String(s).replace(/(["\\.@])/g, "\\$1");
  }

  /* -----------------------------------------------------------------
   *  Identity section
   * ----------------------------------------------------------------- */
  function renderIdentitySection(p) {
    const sec = elem("div", { className: "sb-card-section" });
    sec.appendChild(elem("div", { className: "sb-card-section-eyebrow" },
      elem("span", { text: "identity" }),
      elem("span", { className: "hint", text: "synthetic only" })
    ));

    const nameInput = elem("input", { className: "sb-name-input", attrs: { type: "text", value: p.displayName, "aria-label": "display name" } });
    nameInput.addEventListener("input", (e) => {
      p.displayName = e.target.value;
      const card = e.target.closest(".sb-card");
      if (card) {
        const nm = card.querySelector(".sb-card-name");
        if (nm) nm.textContent = p.displayName;
        const av = card.querySelector(".sb-avatar");
        if (av) av.textContent = initialsOf(p.displayName);
      }
      renderRequestSelects();
      persistSession();
    });
    sec.appendChild(nameInput);

    sec.appendChild(elem("div", { className: "sb-pid-row", text: p.id }));

    const delBtn = elem("button", { className: "sb-delete-link", attrs: { type: "button" }, text: "remove principal" });
    delBtn.addEventListener("click", () => deletePrincipal(p.id));
    sec.appendChild(delBtn);

    return sec;
  }

  /* -----------------------------------------------------------------
   *  Calendar section
   * ----------------------------------------------------------------- */
  function renderCalendarSection(p) {
    const sec = elem("div", { className: "sb-card-section" });
    sec.appendChild(elem("div", { className: "sb-card-section-eyebrow" },
      elem("span", { text: "calendar" }),
      elem("span", { className: "hint", text: p.calendar.length + " / " + MAX_EVENTS })
    ));

    // Archetype auto-fill dropdown
    const archRow = elem("div", { className: "sb-archetype-row" });
    archRow.appendChild(elem("div", { className: "sb-archetype-label", text: "auto-fill" }));
    const archSel = elem("select", { className: "sb-archetype-select", attrs: { "aria-label": "auto-fill from archetype" } });
    const placeholderTxt = p.calendar.length > 0
      ? "— pick an archetype (replaces current) —"
      : "— pick an archetype —";
    archSel.appendChild(elem("option", { attrs: { value: "" }, text: placeholderTxt }));
    Object.keys(ARCHETYPES).forEach(k => {
      archSel.appendChild(elem("option", { attrs: { value: k }, text: ARCHETYPES[k].label }));
    });
    archSel.addEventListener("change", (e) => {
      const key = e.target.value;
      if (!key) return;
      if (p.calendar.length > 0) {
        const ok = window.confirm("Replace " + p.displayName + "'s current calendar with the \"" + ARCHETYPES[key].label + "\" archetype?");
        if (!ok) { archSel.value = ""; return; }
      }
      applyArchetype(p, key);
    });
    archRow.appendChild(archSel);
    sec.appendChild(archRow);

    const ul = elem("ul", { className: "sb-event-list" });
    if (p.calendar.length === 0) {
      ul.appendChild(elem("li", { className: "sb-empty-events", text: "— no events yet — pick an archetype above or use \"add event\" below —" }));
    } else {
      p.calendar.forEach((ev, idx) => ul.appendChild(renderEventRow(p, ev, idx)));
    }
    sec.appendChild(ul);

    const addBtn = elem("button", { className: "sb-add-event-btn", attrs: { type: "button" }, text: "+ add event" });
    if (p.calendar.length >= MAX_EVENTS) addBtn.disabled = true;
    addBtn.addEventListener("click", () => {
      if (p.calendar.length >= MAX_EVENTS) return;
      p.calendar.push({ time: "13:00", duration: 30, title: "", attendees: "", isBlocking: false });
      persistSession();
      rerenderCard(p);
    });
    sec.appendChild(addBtn);

    return sec;
  }

  function renderEventRow(p, ev, idx) {
    const li = elem("li", { className: "sb-event-row" });

    const time = elem("input", { attrs: { type: "time", value: ev.time, "aria-label": "time" } });
    time.addEventListener("change", (e) => { ev.time = e.target.value; persistSession(); });
    li.appendChild(time);

    const dur = elem("input", { attrs: { type: "number", value: String(ev.duration), min: "5", max: "480", step: "5", "aria-label": "duration minutes" } });
    dur.addEventListener("change", (e) => { ev.duration = parseInt(e.target.value, 10) || 30; persistSession(); });
    li.appendChild(dur);

    const title = elem("input", { attrs: { type: "text", value: ev.title, placeholder: "event title", "aria-label": "title" } });
    title.addEventListener("input", (e) => { ev.title = e.target.value; persistSession(); });
    li.appendChild(title);

    const rm = elem("button", { className: "sb-event-remove", attrs: { type: "button", "aria-label": "remove event" }, text: "×" });
    rm.addEventListener("click", () => {
      p.calendar.splice(idx, 1);
      persistSession();
      rerenderCard(p);
    });
    li.appendChild(rm);

    const attRow = elem("div", { className: "sb-event-attendees-row" });
    const att = elem("input", { attrs: { type: "text", value: ev.attendees || "", placeholder: "attendees (comma-separated, synthetic)", "aria-label": "attendees" } });
    att.addEventListener("input", (e) => { ev.attendees = e.target.value; persistSession(); });
    attRow.appendChild(att);
    li.appendChild(attRow);

    // Per-event hard-block toggle. When ON, the event "blocks" — a request
    // for this slot will trigger a cascading reschedule. Visible terracotta
    // so users can see what will trigger a 3-party run.
    const blockRow = elem("label", {
      className: "sb-event-block-row",
      attrs: { "data-on": String(!!ev.isBlocking) }
    });
    const blockCb = elem("input", { attrs: { type: "checkbox" } });
    if (ev.isBlocking) blockCb.checked = true;
    blockCb.addEventListener("change", (e) => {
      ev.isBlocking = e.target.checked;
      blockRow.dataset.on = String(ev.isBlocking);
      persistSession();
    });
    blockRow.appendChild(blockCb);
    blockRow.appendChild(document.createTextNode("hard block — won't move in a cascade"));
    li.appendChild(blockRow);

    return li;
  }

  function rerenderCard(p) {
    const old = document.querySelector('[data-pid="' + cssEscape(p.id) + '"]');
    if (!old) return;
    const fresh = renderPrincipalCard(p);
    old.replaceWith(fresh);
  }

  /* -----------------------------------------------------------------
   *  Policy section
   * ----------------------------------------------------------------- */
  function renderPolicySection(p) {
    const sec = elem("div", { className: "sb-card-section" });
    sec.appendChild(elem("div", { className: "sb-card-section-eyebrow" },
      elem("span", { text: "privacy" }),
      elem("span", { className: "hint", text: "what " + p.displayName + "'s agent shares" })
    ));

    const panel = elem("div", { className: "sb-friendly-policy" });
    panel.appendChild(elem("p", {
      className: "sb-friendly-policy-intro",
      text: p.displayName + "'s agent will share only what's switched on below. Everything else stays on this side of the wire — a scoped copy is what crosses to other agents."
    }));

    POLICY_TOGGLES.forEach(t => {
      const on = isFieldShared(p, t.field);
      const row = elem("div", {
        className: "sb-toggle-row",
        attrs: { "data-on": String(on), role: "checkbox", "aria-checked": String(on), tabindex: "0" }
      });
      row.appendChild(elem("div", { className: "sb-toggle-switch", attrs: { "aria-hidden": "true" } }));

      const lbl = elem("div", { className: "sb-toggle-label" });
      lbl.appendChild(document.createTextNode(t.label));
      const small = elem("span", { className: "small" });
      small.appendChild(document.createTextNode(t.desc + " · "));
      small.appendChild(elem("span", { className: "field-code", text: t.field }));
      lbl.appendChild(small);
      row.appendChild(lbl);

      function flip() {
        const next = !isFieldShared(p, t.field);
        setFieldShared(p, t.field, next);
        row.dataset.on = String(next);
        row.setAttribute("aria-checked", String(next));
      }
      row.addEventListener("click", flip);
      row.addEventListener("keydown", (e) => {
        if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
      });
      panel.appendChild(row);
    });

    // Cascade — plain English radio group
    const cas = elem("div", { className: "sb-cascade-block" });
    cas.appendChild(elem("p", {
      className: "sb-cascade-title",
      text: "How far can " + p.displayName + "'s agent negotiate on their behalf?"
    }));
    const opts = elem("div", { className: "sb-cascade-radios" });
    const CASCADE_OPTIONS = [
      { v: 0, label: "Just answer yes / no",                                small: "depth 0 · no cascades, safest" },
      { v: 1, label: "Can ask one other person on " + p.displayName + "'s behalf", small: "depth 1 · default · the cascading-reschedule scenario" },
      { v: 2, label: "Can chain up to two reshuffles",                      small: "depth 2 · more flexibility" },
      { v: 3, label: "Allow deep cascades",                                 small: "depth 3 · agent has wide latitude" }
    ];
    const radioName = "sb-cascade-" + slugify(p.id);
    CASCADE_OPTIONS.forEach(o => {
      const optLbl = elem("label", { className: "sb-cascade-opt" });
      const r = elem("input", { attrs: { type: "radio", name: radioName, value: String(o.v) } });
      if (p.policy.maxCascadeDepth === o.v) r.checked = true;
      r.addEventListener("change", () => {
        p.policy.maxCascadeDepth = o.v;
        persistSession();
      });
      optLbl.appendChild(r);
      const txt = elem("div");
      txt.appendChild(document.createTextNode(o.label));
      txt.appendChild(elem("span", { className: "small", text: o.small }));
      optLbl.appendChild(txt);
      opts.appendChild(optLbl);
    });
    cas.appendChild(opts);
    panel.appendChild(cas);

    sec.appendChild(panel);

    // Advanced — show the raw policy tag lists for power users
    const adv = elem("details", { className: "sb-policy-advanced" });
    adv.appendChild(elem("summary", { text: "show raw policy fields" }));
    const advBody = elem("div", { className: "sb-policy-advanced-body" });
    advBody.appendChild(elem("div", {
      className: "sb-policy-advanced-hint",
      text: "the underlying meshycal.scheduling/proposal-v1 field lists. the toggles above edit these; you can also edit directly here."
    }));
    advBody.appendChild(renderTagField(p, "outboundAllow", "outbound · allow", false));
    advBody.appendChild(renderTagField(p, "outboundBlock", "outbound · block", true));
    advBody.appendChild(renderTagField(p, "inboundAllow",  "inbound · allow",  false));
    adv.appendChild(advBody);
    sec.appendChild(adv);

    return sec;
  }

  function renderTagField(p, field, label, blockStyle) {
    const wrap = elem("div");
    wrap.appendChild(elem("div", { className: "sb-policy-label", text: label }));
    const tags = elem("div", { className: "sb-tags" });

    p.policy[field].forEach((t, i) => tags.appendChild(renderTagChip(p, field, t, i, blockStyle)));

    const input = elem("input", { className: "sb-tag-input", attrs: { type: "text", placeholder: "+ field name", "aria-label": label } });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const v = String(input.value || "").trim();
        if (v && !p.policy[field].includes(v)) {
          p.policy[field].push(v);
          persistSession();
          rerenderCard(p);
        }
      }
    });
    tags.appendChild(input);

    wrap.appendChild(tags);
    return wrap;
  }

  function renderTagChip(p, field, tag, idx, blockStyle) {
    const chip = elem("span", { className: "sb-tag-chip" + (blockStyle ? " sb-tag-chip--block" : "") });
    chip.appendChild(document.createTextNode(tag));
    const x = elem("span", { className: "sb-tag-chip-x", text: "×", attrs: { "aria-label": "remove tag" } });
    x.addEventListener("click", (e) => {
      e.stopPropagation();
      p.policy[field].splice(idx, 1);
      persistSession();
      rerenderCard(p);
    });
    chip.appendChild(x);
    return chip;
  }

  /* -----------------------------------------------------------------
   *  Reasoner section
   * ----------------------------------------------------------------- */
  function renderReasonerSection(p) {
    const sec = elem("div", { className: "sb-card-section" });
    sec.appendChild(elem("div", { className: "sb-card-section-eyebrow" },
      elem("span", { text: "reasoner" }),
      elem("span", { className: "hint", text: "who picks the slot" })
    ));

    const grid = elem("div", { className: "sb-reasoner-grid" });

    // Provider
    const providerLabel = elem("label", { className: "sb-field-label", text: "provider" });
    grid.appendChild(providerLabel);
    const provider = elem("select");
    ["scripted", "anthropic", "openai", "openai-compatible"].forEach(opt => {
      const o = elem("option", { attrs: { value: opt }, text: opt });
      if (p.reasoner.provider === opt) o.selected = true;
      provider.appendChild(o);
    });
    grid.appendChild(provider);

    // Model name
    const modelWrap = elem("div", { className: p.reasoner.provider === "scripted" ? "sb-hidden" : "" });
    modelWrap.appendChild(elem("label", { className: "sb-field-label", text: "model" }));
    const model = elem("input", { attrs: { type: "text", value: p.reasoner.model || "", placeholder: modelPlaceholder(p.reasoner.provider), "aria-label": "model" } });
    modelWrap.appendChild(model);
    grid.appendChild(modelWrap);

    // API key
    const apikeyWrap = elem("div", { className: p.reasoner.provider === "scripted" ? "sb-hidden" : "" });
    apikeyWrap.appendChild(elem("label", { className: "sb-field-label", text: "API key" }));
    const apikey = elem("input", { attrs: { type: "password", value: SB_STATE.apiKeys[p.id] || "", placeholder: "session only — never stored", "aria-label": "API key" } });
    apikey.addEventListener("input", (e) => { SB_STATE.apiKeys[p.id] = e.target.value; });
    apikeyWrap.appendChild(apikey);
    apikeyWrap.appendChild(elem("div", { className: "sb-apikey-warning", text: "Lives in memory only. Sent only to the provider's API endpoint, never persisted. You'll re-enter it after a page refresh." }));
    grid.appendChild(apikeyWrap);

    // Base URL (openai-compatible only)
    const baseWrap = elem("div", { className: p.reasoner.provider === "openai-compatible" ? "" : "sb-hidden" });
    baseWrap.appendChild(elem("label", { className: "sb-field-label", text: "base URL" }));
    const base = elem("input", { attrs: { type: "url", value: p.reasoner.baseUrl || "", placeholder: "https://api.example.com/v1", "aria-label": "base URL" } });
    baseWrap.appendChild(base);
    grid.appendChild(baseWrap);

    // Wire provider changes after refs exist
    provider.addEventListener("change", (e) => {
      p.reasoner.provider = e.target.value;
      model.placeholder = modelPlaceholder(p.reasoner.provider);
      if (p.reasoner.provider === "scripted") {
        modelWrap.classList.add("sb-hidden");
        apikeyWrap.classList.add("sb-hidden");
        baseWrap.classList.add("sb-hidden");
        SB_STATE.apiKeys[p.id] = "";
        apikey.value = "";
      } else {
        modelWrap.classList.remove("sb-hidden");
        apikeyWrap.classList.remove("sb-hidden");
        baseWrap.classList.toggle("sb-hidden", p.reasoner.provider !== "openai-compatible");
      }
      // Update badge
      const card = e.target.closest(".sb-card");
      if (card) {
        const oldBadge = card.querySelector(".sb-reasoner-badge");
        if (oldBadge) oldBadge.replaceWith(reasonerBadge(p));
      }
      persistSession();
    });
    model.addEventListener("input", (e) => { p.reasoner.model = e.target.value; persistSession(); });
    base.addEventListener("input",  (e) => { p.reasoner.baseUrl = e.target.value; persistSession(); });

    sec.appendChild(grid);
    return sec;
  }

  function modelPlaceholder(provider) {
    if (provider === "anthropic") return "claude-sonnet-4-6";
    if (provider === "openai") return "gpt-4o";
    if (provider === "openai-compatible") return "model name";
    return "";
  }

  /* -----------------------------------------------------------------
   *  Add / delete principal
   * ----------------------------------------------------------------- */
  function addPrincipal() {
    if (SB_STATE.principals.length >= MAX_PRINCIPALS) return;
    const seed = nextPrincipalId();
    SB_STATE.principals.push({
      id: seed.id,
      displayName: seed.displayName,
      colorSlot: nextColorSlot(),
      calendar: [],
      policy: {
        outboundAllow: DEFAULT_OUTBOUND_ALLOW.slice(),
        outboundBlock: DEFAULT_OUTBOUND_BLOCK.slice(),
        inboundAllow:  DEFAULT_INBOUND_ALLOW.slice(),
        maxCascadeDepth: 1
      },
      reasoner: { provider: "scripted", model: "", baseUrl: "" }
    });
    SB_STATE.openCards.add(seed.id);
    persistSession();
    renderEditor();
  }

  function deletePrincipal(id) {
    SB_STATE.principals = SB_STATE.principals.filter(p => p.id !== id);
    SB_STATE.openCards.delete(id);
    delete SB_STATE.apiKeys[id];
    persistSession();
    renderEditor();
  }

  /* ===================================================================
   *  Request form
   * =================================================================== */
  function renderRequestSelects() {
    const sender = $("sb-req-sender");
    const recipient = $("sb-req-recipient");
    const senderVal = sender.value;
    const recipientVal = recipient.value;

    clearChildren(sender);
    clearChildren(recipient);

    SB_STATE.principals.forEach((p, i) => {
      const o1 = elem("option", { attrs: { value: p.id }, text: p.displayName });
      const o2 = elem("option", { attrs: { value: p.id }, text: p.displayName });
      sender.appendChild(o1);
      recipient.appendChild(o2);
    });

    if (SB_STATE.principals.length >= 1) {
      sender.value = SB_STATE.principals.some(p => p.id === senderVal) ? senderVal : SB_STATE.principals[0].id;
    }
    if (SB_STATE.principals.length >= 2) {
      const altDefault = SB_STATE.principals.find(p => p.id !== sender.value);
